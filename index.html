<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060d">
<title>WAYFORTH — Move. Build. Create.</title>
<style>
:root{
  --gold:#efbd61; --gold2:#ffd98b; --blue:#54bfff; --blue2:#8ce2ff;
  --ink:#02060d; --panel:rgba(4,12,24,.70); --line:rgba(255,255,255,.14);
  --ease:cubic-bezier(.16,.84,.18,1); --snap:cubic-bezier(.34,1.18,.52,1);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
a,button{font:inherit;color:inherit}
button{border:0}
.app{position:fixed;inset:0;background:#02060d;overflow:hidden}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;background:#02060d;transition:opacity .26s ease,visibility .26s ease}
.view.active{opacity:1;visibility:visible;pointer-events:auto}
.frame{width:100%;height:100%;border:0;display:block;background:#02060d}

/* ===== HOME WORLD ===== */
.home{isolation:isolate;overflow:hidden;background:#02060d}
.stage{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:#02060d;transform-origin:50% 29%;will-change:transform,filter,opacity}
.atmosphere{position:absolute;inset:-9%;background:url('world-atmosphere.webp') center/cover no-repeat;filter:blur(4px) saturate(1.22);transform:scale(1.10);opacity:1}
.atmosphere:before{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse at 50% 49%,rgba(247,177,69,.25),transparent 26%),
  radial-gradient(circle at 50% 18%,rgba(34,112,233,.25),transparent 34%),
  linear-gradient(180deg,rgba(2,7,17,.04),rgba(2,6,13,.10) 45%,rgba(2,6,13,.76) 100%)}
.atmosphere:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 28%,rgba(0,0,0,.20) 64%,rgba(0,0,0,.58) 100%)}

/* star/energy field */
.starfield{position:absolute;inset:0;opacity:.32;mix-blend-mode:screen;background-image:
 radial-gradient(circle at 9% 16%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 78% 13%,#99d7ff 0 1px,transparent 1.5px),radial-gradient(circle at 57% 9%,#fff2c4 0 1px,transparent 1.5px),radial-gradient(circle at 34% 27%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 91% 38%,#fff 0 1px,transparent 1.5px);background-size:170px 150px,230px 190px,270px 220px,310px 260px,360px 290px;animation:stars 20s linear infinite}
@keyframes stars{to{transform:translate3d(-14px,9px,0)}}

/* globe */
.globe-wrap{position:absolute;z-index:6;left:35.66%;top:5.52%;width:28.92%;aspect-ratio:373/335;transform-origin:50% 50%;will-change:left,top,width,transform,filter,opacity}
.globe-img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 20px rgba(79,171,255,.48)) drop-shadow(0 0 46px rgba(239,189,97,.20));user-select:none;pointer-events:none}
.orbit{position:absolute;z-index:-1;left:50%;top:50%;border-radius:50%;border:1px solid rgba(102,199,255,.38);box-shadow:0 0 18px rgba(55,155,255,.16);transform:translate(-50%,-50%) rotate(-12deg);opacity:.46}
.orbit.o1{width:132%;height:66%}.orbit.o2{width:145%;height:74%;border-color:rgba(239,189,97,.27);transform:translate(-50%,-50%) rotate(18deg)}
.energy-node{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff,0 0 19px rgba(78,181,255,.9);opacity:.0}
.energy-node.n1{left:7%;top:35%}.energy-node.n2{right:5%;top:42%}.energy-node.n3{left:48%;bottom:-1%;box-shadow:0 0 8px #fff,0 0 19px rgba(246,187,80,.9)}

/* independent worlds */
.build-layer,.build-wire,.truck-layer,.dd-dark,.dd-light{position:absolute;z-index:5;pointer-events:none;user-select:none;will-change:transform,opacity,filter,clip-path}
.build-layer{left:0;top:0;width:40.23%;height:auto;opacity:0;transform-origin:48% 88%;filter:drop-shadow(0 18px 28px rgba(0,0,0,.28))}
.build-wire{left:0;top:.28%;width:40.62%;height:auto;opacity:0;mix-blend-mode:screen;filter:drop-shadow(0 0 8px rgba(255,190,73,.35))}
.truck-layer{left:33.88%;top:44%;width:30%;height:auto;opacity:0;transform-origin:54% 76%;filter:drop-shadow(0 18px 24px rgba(0,0,0,.30))}
.dd-dark,.dd-light{left:62.02%;top:5.66%;width:37.98%;height:auto;transform-origin:75% 60%}
.dd-dark{opacity:0;filter:brightness(.13) saturate(.45)}
.dd-light{opacity:0;filter:drop-shadow(0 10px 26px rgba(21,64,190,.22))}

/* construction scan / floor energy */
.build-scan{position:absolute;z-index:7;left:0;width:40%;height:4px;background:linear-gradient(90deg,transparent,rgba(255,214,126,.15),#ffd67c 38%,#fff 50%,#eeb95e 64%,transparent);filter:blur(.35px) drop-shadow(0 0 7px rgba(255,193,74,.9));opacity:0;pointer-events:none}
.crane-load{position:absolute;z-index:8;left:20.8%;top:12%;width:4.8%;height:8%;opacity:0;pointer-events:none;transform-origin:50% 0}
.crane-load:before{content:"";position:absolute;left:50%;top:-160%;width:1px;height:172%;background:linear-gradient(#ffc85d,rgba(255,200,93,.18));box-shadow:0 0 6px rgba(255,196,76,.6)}
.crane-load:after{content:"";position:absolute;left:0;bottom:0;width:100%;height:42%;border-radius:2px;background:linear-gradient(180deg,#9a6b2d,#4e3113);border:1px solid rgba(255,218,145,.5);box-shadow:0 5px 13px rgba(0,0,0,.35),0 0 13px rgba(255,178,55,.24)}

/* truck route/headlights */
.route-line{position:absolute;z-index:4;left:31%;top:50%;width:40%;height:22%;opacity:0;pointer-events:none;overflow:visible}
.route-line path{fill:none;stroke:url(#routeG);stroke-width:2;stroke-linecap:round;stroke-dasharray:7 11;filter:drop-shadow(0 0 5px rgba(75,182,255,.8))}
.headlight{position:absolute;z-index:8;left:51.3%;top:63.4%;width:7%;height:4%;border-radius:50%;opacity:0;pointer-events:none;background:radial-gradient(ellipse,#fff 0 5%,#dff4ff 14%,rgba(80,176,255,.56) 35%,transparent 70%);mix-blend-mode:screen;filter:blur(.2px)}

/* DD power sequence */
.dd-glow{position:absolute;z-index:8;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:0}
.dd-g1{left:72%;top:13%;width:10%;aspect-ratio:1;background:radial-gradient(circle,#fff 0 7%,rgba(225,242,255,.9) 16%,rgba(90,168,255,.25) 45%,transparent 72%)}
.dd-g2{left:79.5%;top:11%;width:11%;aspect-ratio:1;background:radial-gradient(circle,#fff 0 7%,rgba(225,242,255,.9) 16%,rgba(90,168,255,.25) 45%,transparent 72%)}
.dd-g3{left:79%;top:24%;width:18%;height:17%;background:radial-gradient(ellipse,rgba(67,182,255,.54),rgba(34,72,255,.22) 40%,transparent 72%)}
.dd-g4{right:1%;top:16%;width:13%;height:22%;background:radial-gradient(circle,rgba(92,191,255,.62),rgba(48,72,255,.22) 42%,transparent 72%)}

/* road depth */
.road-streaks{position:absolute;z-index:2;left:-8%;right:-8%;bottom:5%;height:28%;overflow:hidden;opacity:.0;mix-blend-mode:screen;pointer-events:none}
.road-streaks i{position:absolute;height:2px;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(63,165,255,.78),rgba(255,225,165,.92),transparent);filter:blur(.4px)}
.road-streaks i:nth-child(1){left:-24%;top:25%;width:41%;animation:roadL 2.4s linear infinite}.road-streaks i:nth-child(2){left:-30%;top:53%;width:48%;animation:roadL 2.0s .4s linear infinite}.road-streaks i:nth-child(3){right:-27%;top:36%;width:44%;animation:roadR 2.7s .2s linear infinite}.road-streaks i:nth-child(4){right:-30%;top:69%;width:51%;animation:roadR 2.1s .7s linear infinite}
@keyframes roadL{to{left:110%}}@keyframes roadR{to{right:110%}}

/* interface arrives last */
.chrome{position:absolute;z-index:30;inset:0;opacity:0;pointer-events:none;transition:opacity .4s ease}
.nav{position:absolute;left:3.4%;right:3.4%;top:max(18px,env(safe-area-inset-top));height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;color:rgba(255,255,255,.92)}
.brand{justify-self:start;display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:750;letter-spacing:.18em;font-size:clamp(13px,1.2vw,18px)}
.brand-mark{width:31px;height:18px;position:relative}.brand-mark:before,.brand-mark:after{content:"";position:absolute;top:2px;width:17px;height:14px;border:3px solid var(--gold);border-top:0;transform:skewX(-27deg)}.brand-mark:before{left:0}.brand-mark:after{right:0;transform:skewX(27deg)}
.navlinks{display:flex;gap:clamp(17px,2.4vw,36px);font-size:10px;font-weight:800;letter-spacing:.12em}.navlinks a{text-decoration:none;opacity:.68;transition:.2s}.navlinks a:hover{opacity:1}.nav-quote{justify-self:end;padding:12px 20px;border:1px solid rgba(244,192,91,.55);border-radius:999px;text-decoration:none;font-size:10px;font-weight:850;letter-spacing:.12em;background:rgba(9,11,16,.44);box-shadow:0 0 24px rgba(239,189,97,.08);backdrop-filter:blur(10px)}
.division-card{position:absolute;z-index:31;display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:linear-gradient(120deg,rgba(4,13,25,.84),rgba(5,10,20,.62));backdrop-filter:blur(13px);box-shadow:0 14px 44px rgba(0,0,0,.26);transition:transform .28s var(--ease),border-color .28s,background .28s;pointer-events:auto;overflow:hidden}
.division-card:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.08),transparent);transform:translateX(-120%);transition:transform .65s ease}.division-card:hover:before{transform:translateX(120%)}.division-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.28)}
.division-card .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.13);font-size:19px}.division-card strong{display:block;font-size:15px;line-height:1.05;letter-spacing:.03em}.division-card small{display:block;margin-top:4px;font-size:8px;letter-spacing:.13em;color:rgba(255,255,255,.58)}.division-card .arr{margin-left:auto;width:27px;height:27px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:12px}
.card-build{left:2.7%;top:48.8%;width:25%}.card-build .ico{color:var(--gold2)}.card-truck{left:35.1%;top:69%;width:30%}.card-truck .ico{color:var(--blue2)}.card-media{right:2.7%;top:48.8%;width:25%}.card-media .ico{color:#92a7ff}
.tagline{position:absolute;z-index:29;left:50%;bottom:6.5%;transform:translateX(-50%);text-align:center;white-space:nowrap;text-shadow:0 8px 26px rgba(0,0,0,.5)}.tagline b{display:block;font-size:clamp(20px,2.45vw,38px);letter-spacing:.24em;font-weight:500}.tagline b .g{color:var(--gold2)}.tagline b .b{color:#77cfff}.tagline span{display:block;margin-top:10px;font-size:8px;letter-spacing:.34em;color:rgba(255,255,255,.55)}
.status{position:absolute;z-index:34;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));font-size:8px;letter-spacing:.16em;color:rgba(255,255,255,.46);padding:8px 11px;border:1px solid rgba(255,255,255,.09);border-radius:999px;background:rgba(2,8,16,.42);backdrop-filter:blur(10px);opacity:0}

/* ===== INTRO TIMELINE ===== */
.home.intro .globe-wrap{animation:globeIntro 4.2s var(--ease) both}
.home.intro .orbit.o1{animation:orbitIntro 4.0s .12s ease both}.home.intro .orbit.o2{animation:orbitIntro2 4.0s .22s ease both}
.home.intro .energy-node.n1{animation:nodeBlink 2.1s .18s ease both}.home.intro .energy-node.n2{animation:nodeBlink 2.1s .34s ease both}.home.intro .energy-node.n3{animation:nodeBlink 2.1s .55s ease both}
.home.intro .build-wire{animation:wireBuild 1.05s 1.30s ease both}.home.intro .build-layer{animation:buildConstruct 1.70s 1.42s var(--ease) both}.home.intro .build-scan{animation:scanBuild 1.65s 1.42s ease-in-out both}.home.intro .crane-load{animation:craneLower 1.25s 1.95s var(--snap) both}
.home.intro .route-line{animation:routeWake .85s 1.72s ease both}.home.intro .truck-layer{animation:truckDrive 1.42s 1.90s cubic-bezier(.18,.82,.2,1) both}.home.intro .headlight{animation:headlightOn .72s 2.82s ease-out both}
.home.intro .dd-dark{animation:ddStructure .74s 2.18s ease-out both}.home.intro .dd-light{animation:ddPower 1.18s 2.63s steps(1,end) both}.home.intro .dd-g1{animation:lightSwitch 1.22s 2.58s steps(1,end) both}.home.intro .dd-g2{animation:lightSwitch 1.18s 2.78s steps(1,end) both}.home.intro .dd-g3{animation:lightSwitch 1.08s 2.98s steps(1,end) both}.home.intro .dd-g4{animation:lightSwitch 1.12s 3.15s steps(1,end) both}
.home.intro .chrome{animation:chromeIn .65s 3.52s ease both}.home.intro .road-streaks{animation:roadIn .72s 3.36s ease both}.home.intro .status{animation:statusIn .6s 3.75s ease both}
@keyframes globeIntro{
  0%{left:50%;top:50%;width:74%;transform:translate(-50%,-50%) scale(1.48);filter:drop-shadow(0 0 46px rgba(73,165,255,.65)) brightness(.88)}
  9%{filter:drop-shadow(0 0 72px rgba(97,190,255,.75)) drop-shadow(0 0 36px rgba(255,196,88,.36)) brightness(1.15)}
  17%{transform:translate(-50%,-50%) scale(1.34) rotate(.4deg)}
  38%{left:50%;top:39%;width:47%;transform:translate(-50%,-50%) scale(1.08)}
  64%,100%{left:35.66%;top:5.52%;width:28.92%;transform:none;filter:drop-shadow(0 0 21px rgba(75,169,255,.44)) drop-shadow(0 0 43px rgba(239,189,97,.18))}
}
@keyframes orbitIntro{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(.38)}13%{opacity:1}60%{opacity:.60;transform:translate(-50%,-50%) rotate(48deg) scale(1.10)}100%{opacity:.40;transform:translate(-50%,-50%) rotate(84deg) scale(1)}}
@keyframes orbitIntro2{0%{opacity:0;transform:translate(-50%,-50%) rotate(18deg) scale(.42)}18%{opacity:.9}64%{opacity:.46;transform:translate(-50%,-50%) rotate(-42deg) scale(1.10)}100%{opacity:.32;transform:translate(-50%,-50%) rotate(-18deg) scale(1)}}
@keyframes nodeBlink{0%,16%{opacity:0;transform:scale(.4)}22%{opacity:1;transform:scale(1.5)}33%{opacity:.15;transform:scale(.8)}48%{opacity:.85}70%,100%{opacity:.28;transform:scale(1)}}
@keyframes wireBuild{0%{opacity:0;clip-path:inset(100% 0 0 0)}18%{opacity:.9}100%{opacity:.36;clip-path:inset(0 0 0 0)}}
@keyframes buildConstruct{0%{opacity:0;clip-path:inset(100% 0 0 0);transform:translateY(2.5%) scale(.99);filter:brightness(.55) saturate(.8)}18%{opacity:.20}42%{opacity:.72;clip-path:inset(53% 0 0 0)}70%{opacity:.94;clip-path:inset(18% 0 0 0);filter:brightness(.92)}100%{opacity:1;clip-path:inset(0 0 0 0);transform:none;filter:none}}
@keyframes scanBuild{0%{top:67%;opacity:0}12%{opacity:1}82%{opacity:.85}100%{top:2%;opacity:0}}
@keyframes craneLower{0%{opacity:0;transform:translateY(-90%) rotate(-2deg)}25%{opacity:1}72%{transform:translateY(14%) rotate(1deg)}88%{transform:translateY(5%) rotate(-.6deg)}100%{opacity:.82;transform:translateY(8%)}}
@keyframes routeWake{0%{opacity:0;transform:scale(.82)}100%{opacity:.55;transform:scale(1)}}
@keyframes truckDrive{0%{opacity:0;left:24%;top:37%;width:11%;transform:rotate(-1.2deg);filter:blur(9px) brightness(.82)}20%{opacity:.5}54%{left:29%;top:39.5%;width:19%;filter:blur(3px) brightness(.96)}79%{left:34.8%;top:43.5%;width:31%;transform:rotate(.25deg);filter:blur(.4px);opacity:1}90%{left:33.3%;top:44%;width:29.4%;transform:rotate(-.1deg)}100%{left:33.88%;top:44%;width:30%;transform:none;opacity:1;filter:none}}
@keyframes headlightOn{0%{opacity:0;transform:scale(.45)}42%{opacity:1;transform:scale(1.45)}100%{opacity:.34;transform:scale(1)}}
@keyframes ddStructure{0%{opacity:0;transform:translateX(7%) scale(1.02);filter:brightness(.04) blur(6px)}100%{opacity:.95;transform:none;filter:brightness(.13) saturate(.45)}}
@keyframes ddPower{0%{opacity:0;filter:brightness(.12) saturate(.4)}16%{opacity:.34;filter:brightness(.78)}27%{opacity:.10;filter:brightness(.2)}43%{opacity:.72;filter:brightness(1.04)}55%{opacity:.26;filter:brightness(.36)}72%,100%{opacity:1;filter:brightness(1) saturate(1)}}
@keyframes lightSwitch{0%,12%{opacity:0;transform:scale(.75)}18%{opacity:1;transform:scale(1.35)}29%{opacity:.06;transform:scale(.9)}41%{opacity:.95;transform:scale(1.1)}55%{opacity:.18}72%,100%{opacity:.35;transform:scale(1)}}
@keyframes chromeIn{0%{opacity:0;transform:translateY(8px);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
@keyframes roadIn{0%{opacity:0}100%{opacity:.30}}@keyframes statusIn{to{opacity:1}}

.home.ready .chrome{opacity:1;pointer-events:auto}.home.ready .build-layer,.home.ready .truck-layer,.home.ready .dd-light{opacity:1}.home.ready .dd-dark,.home.ready .build-wire{opacity:0}.home.ready .road-streaks{opacity:.30}.home.ready .headlight{animation:ambientHead 3.5s ease-in-out infinite}.home.ready .dd-g1{animation:ambientDD 4.4s ease-in-out infinite}.home.ready .dd-g2{animation:ambientDD 5.2s .8s ease-in-out infinite}.home.ready .dd-g3{animation:ambientDD 5.8s 1.4s ease-in-out infinite}.home.ready .dd-g4{animation:ambientDD 4.8s .4s ease-in-out infinite}.home.ready .status{opacity:1}
@keyframes ambientHead{0%,100%{opacity:.12}50%{opacity:.38}}@keyframes ambientDD{0%,100%{opacity:.08}48%{opacity:.22}52%{opacity:.34}}

/* ===== GLOBE TRAVEL TRANSITION ===== */
.travel{position:absolute;inset:0;z-index:200;pointer-events:none;opacity:0;visibility:hidden;overflow:hidden;background:#02060d}
.travel.active{opacity:1;visibility:visible}
.travel-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,rgba(17,66,156,.22),#02060d 58%);opacity:0}
.travel-globe{position:absolute;left:50%;top:50%;width:min(34vw,34vh);aspect-ratio:373/335;transform:translate(-50%,-50%) scale(.34);opacity:0;filter:drop-shadow(0 0 34px rgba(74,176,255,.55)) drop-shadow(0 0 80px rgba(239,189,97,.18))}
.travel-globe img{width:100%;height:100%;object-fit:contain}
.travel-orbit{position:absolute;left:50%;top:50%;width:42vmin;height:22vmin;border:1px solid rgba(119,206,255,.56);border-radius:50%;transform:translate(-50%,-50%) rotate(-12deg) scale(.3);opacity:0}
.warp{position:absolute;inset:-30%;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg 6deg,rgba(93,193,255,.10) 6.5deg 7deg,transparent 7.5deg 12deg);filter:blur(.4px);transform:scale(.6)}
.travel-label{position:absolute;left:50%;top:83%;transform:translate(-50%,15px);font-size:9px;font-weight:850;letter-spacing:.28em;opacity:0;white-space:nowrap;color:rgba(255,255,255,.72)}
.sky-gate{position:absolute;inset:0;opacity:0;background:linear-gradient(180deg,#103566,#77b6e6 45%,#f3bd68 100%)}
.travel.to-trucking .sky-gate{background:linear-gradient(180deg,#031127,#0d4a7b 54%,#efab52 120%)}
.travel.to-media .sky-gate{background:linear-gradient(180deg,#020613,#081c48 55%,#1b42a0 100%)}
.travel.to-quote .sky-gate{background:linear-gradient(180deg,#090d17,#23170a 100%)}
.home.depart .stage{animation:worldIntoGlobe .98s cubic-bezier(.54,.02,.15,1) both}
.travel.active.forward .travel-bg{animation:travelBg 1.18s ease both}.travel.active.forward .travel-globe{animation:globeTakeover 1.18s cubic-bezier(.48,.01,.10,1) both}.travel.active.forward .travel-orbit{animation:travelOrbit 1.03s ease-out both}.travel.active.forward .warp{animation:warpIn 1.18s ease both}.travel.active.forward .sky-gate{animation:skyGate 1.18s ease both}.travel.active.forward .travel-label{animation:labelIn .85s .18s ease both}
@keyframes worldIntoGlobe{0%{transform:scale(1);filter:none}54%{transform:scale(1.45);filter:blur(.7px) brightness(.95)}100%{transform:scale(3.8);filter:blur(4px) brightness(1.12);opacity:.04}}
@keyframes travelBg{0%{opacity:0}24%{opacity:.9}100%{opacity:1}}
@keyframes globeTakeover{0%{opacity:.18;transform:translate(-50%,-50%) scale(.26)}14%{opacity:1}62%{transform:translate(-50%,-50%) scale(2.15)}100%{opacity:.08;transform:translate(-50%,-50%) scale(7.8);filter:blur(4px) brightness(1.5)}}
@keyframes travelOrbit{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(.2)}22%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(160deg) scale(4.8)}}
@keyframes warpIn{0%,20%{opacity:0;transform:scale(.6)}56%{opacity:.8}100%{opacity:0;transform:scale(2.5)}}
@keyframes skyGate{0%,58%{opacity:0}78%{opacity:.78}100%{opacity:1}}
@keyframes labelIn{0%{opacity:0;transform:translate(-50%,15px)}32%,72%{opacity:.7;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}

/* reverse travel back home */
.travel.active.reverse{background:#02060d}.travel.active.reverse .travel-bg{animation:reverseBg .95s ease both}.travel.active.reverse .travel-globe{animation:globeReturn .95s var(--ease) both}.travel.active.reverse .travel-orbit{animation:returnOrbit .95s ease both}.travel.active.reverse .warp{animation:returnWarp .95s ease both}.travel.active.reverse .sky-gate{opacity:.55;animation:reverseSky .95s ease both}

  @keyframes globeIntroMobile{0%{left:50%;top:45%;width:112%;transform:translate(-50%,-50%) scale(1.5);filter:drop-shadow(0 0 55px rgba(73,165,255,.68)) brightness(.90)}11%{filter:drop-shadow(0 0 80px rgba(97,190,255,.76)) drop-shadow(0 0 42px rgba(255,196,88,.40)) brightness(1.18)}22%{transform:translate(-50%,-50%) scale(1.30)}52%{left:50%;top:25%;width:70%;transform:translate(-50%,-50%) scale(1.05)}75%,100%{left:22%;top:10%;width:56%;transform:none;filter:drop-shadow(0 0 22px rgba(75,169,255,.44))}}

<body>
<main class="app" id="app">
  <section class="view home active intro" id="homeView" aria-label="WAYFORTH home">
    <div class="stage" id="stage">
      <div class="atmosphere"></div><div class="starfield"></div>
      <div class="globe-wrap" id="homeGlobe">
        <img class="globe-img" src="globe-cutout.webp" alt="WAYFORTH globe">
        <span class="orbit o1"></span><span class="orbit o2"></span>
        <span class="energy-node n1"></span><span class="energy-node n2"></span><span class="energy-node n3"></span>
      </div>

      <img class="build-wire" src="build-wire-clean.webp" alt="">
      <img class="build-layer" src="build-clean.webp" alt="WAYFORTH construction">
      <div class="build-scan"></div><span class="crane-load"></span>

      <svg class="route-line" viewBox="0 0 520 180" aria-hidden="true"><defs><linearGradient id="routeG" x1="0" x2="1"><stop offset="0" stop-color="#6ed4ff" stop-opacity="0"/><stop offset=".45" stop-color="#8ce2ff"/><stop offset=".72" stop-color="#f0bf62"/><stop offset="1" stop-color="#f0bf62" stop-opacity="0"/></linearGradient></defs><path d="M22 138 C 135 52, 270 42, 498 118"/></svg>
      <img class="truck-layer" src="truck-clean.webp" alt="WAYFORTH truck"><span class="headlight"></span>

      <img class="dd-dark" src="dd-clean-dark.webp" alt=""><img class="dd-light" src="dd-clean.webp" alt="Digital Dynasty studio">
      <span class="dd-glow dd-g1"></span><span class="dd-glow dd-g2"></span><span class="dd-glow dd-g3"></span><span class="dd-glow dd-g4"></span>
      <div class="road-streaks"><i></i><i></i><i></i><i></i></div>

      <div class="chrome">
        <nav class="nav" aria-label="Primary navigation">
          <a class="brand" href="#home"><span class="brand-mark" aria-hidden="true"></span><span>WAYFORTH</span></a>
          <div class="navlinks"><a href="#home">HOME</a><a href="#build" data-page="build">BUILD</a><a href="#trucking" data-page="trucking">TRUCKING</a><a href="#media" data-page="media">MEDIA</a><a href="#quote" data-page="quote">CONTACT</a></div>
          <a class="nav-quote" href="#quote" data-page="quote">GET A QUOTE →</a>
        </nav>

        <a class="division-card card-build" href="#build" data-page="build"><span class="ico">▥</span><span><strong>BUILD</strong><small>REAL PROJECTS. LASTING VALUE.</small></span><span class="arr">→</span></a>
        <a class="division-card card-truck" href="#trucking" data-page="trucking"><span class="ico">▰</span><span><strong>TRUCKING</strong><small>FREIGHT FORWARD.</small></span><span class="arr">→</span></a>
        <a class="division-card card-media" href="#media" data-page="media"><span class="ico">◉</span><span><strong>MEDIA</strong><small>POWERED BY DIGITAL DYNASTY.</small></span><span class="arr">→</span></a>
        <div class="tagline"><b>MOVE. <span class="g">BUILD.</span> <span class="b">CREATE.</span></b><span>DIFFERENT INDUSTRIES. A BRIGHTER TOMORROW.</span></div>
      </div>
      <div class="status">ORBITAL FOUNDRY • LIVE WORLD</div>
    </div>
  </section>

  <section class="view" id="buildView"><iframe class="frame" id="buildFrame" title="WAYFORTH Build"></iframe></section>
  <section class="view" id="truckingView"><iframe class="frame" id="truckingFrame" title="WAYFORTH Trucking"></iframe></section>
  <section class="view" id="mediaView"><iframe class="frame" id="mediaFrame" title="WAYFORTH Media"></iframe></section>
  <section class="view" id="quoteView"><iframe class="frame" id="quoteFrame" title="WAYFORTH Quote"></iframe></section>

  <div class="travel" id="travel" aria-hidden="true">
    <div class="travel-bg"></div><div class="warp"></div><div class="sky-gate"></div>
    <div class="travel-globe"><img src="globe-cutout.webp" alt=""></div><div class="travel-orbit"></div>
    <div class="travel-label" id="travelLabel">ENTERING WAYFORTH</div>
  </div>
</main>
<script>
(function(){
  const home=document.getElementById('homeView'), stage=document.getElementById('stage'), travel=document.getElementById('travel'), label=document.getElementById('travelLabel');
  const views={home,build:document.getElementById('buildView'),trucking:document.getElementById('truckingView'),media:document.getElementById('mediaView'),quote:document.getElementById('quoteView')};
  const frames={build:document.getElementById('buildFrame'),trucking:document.getElementById('truckingFrame'),media:document.getElementById('mediaFrame'),quote:document.getElementById('quoteFrame')};
  const urls={build:'build.html',trucking:'trucking.html',media:'media.html',quote:'quote.html'};
  const names={build:'ENTERING BUILD',trucking:'ENTERING TRUCKING',media:'ENTERING MEDIA',quote:'WAYFORTH • GET A QUOTE'};
  let current='home',busy=false,introTimer;

  function ensure(page,hash){
    if(!frames[page])return;
    const wanted=urls[page]+(hash||'');
    if(!frames[page].getAttribute('src')) frames[page].setAttribute('src',wanted);
    else if(hash){try{frames[page].contentWindow.location.hash=hash}catch(e){frames[page].setAttribute('src',wanted)}}
  }
  function show(page){Object.values(views).forEach(v=>v.classList.remove('active'));views[page].classList.add('active');current=page}
  function finishIntro(){clearTimeout(introTimer);home.classList.remove('intro');home.classList.add('ready')}

  function travelTo(page,hash){
    if(busy||page===current)return;
    busy=true; finishIntro(); ensure(page,hash);
    label.textContent=names[page]||'WAYFORTH';
    home.classList.add('depart');
    travel.className='travel active forward to-'+page;
    setTimeout(()=>show(page),790);
    setTimeout(()=>{travel.className='travel';home.classList.remove('depart');history.replaceState(null,'','#'+page);busy=false},1190);
  }
  function returnHome(){
    if(busy||current==='home')return;
    busy=true;const from=current;label.textContent='RETURNING TO WAYFORTH';
    travel.className='travel active reverse to-'+from;
    setTimeout(()=>{show('home');finishIntro()},360);
    setTimeout(()=>{travel.className='travel';history.replaceState(null,'','#home');busy=false},980);
  }

  document.addEventListener('click',e=>{const a=e.target.closest('[data-page]');if(!a)return;e.preventDefault();travelTo(a.dataset.page)});
  window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='wf-nav')return;const p=e.data.page;if(p==='home')returnHome();else travelTo(p,e.data.hash||'')});

  introTimer=setTimeout(finishIntro,4300);
  setTimeout(()=>['build','trucking'].forEach(ensure),4500);
  setTimeout(()=>['media','quote'].forEach(ensure),5400);

  const initial=location.hash.replace('#','');
  if(['build','trucking','media','quote'].includes(initial)){finishIntro();ensure(initial);setTimeout(()=>show(initial),60)}
})();
</script>
</body></html>
