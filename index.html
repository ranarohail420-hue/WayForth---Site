<html lang="en">

<title>WAYFORTH — Move. Build. Create.</title>
<style>

.truck-link{position:absolute;z-index:8;left:50%;bottom:8%;width:min(33vw,525px);aspect-ratio:705/739;transform:translateX(-50%);text-decoration:none;opacity:0}.truck{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 25px 30px rgba(0,0,0,.55))}.play .truck-link{animation:truckArrive 1.28s 1.48s cubic-bezier(.12,.90,.22,1) both}.settled .truck-link{opacity:1;transform:translateX(-50%)}@keyframes truckArrive{0%{opacity:0;transform:translate3d(-115%,-19%,0) scale(.22) rotate(-2deg);filter:blur(6px) brightness(1.18)}20%{opacity:.94}73%{transform:translate3d(-47%,1%,0) scale(1.035);filter:blur(0) brightness(1.06)}88%{transform:translate3d(-51%,0,0) scale(.995)}100%{opacity:1;transform:translate3d(-50%,0,0) scale(1);filter:none}}

.division-label{position:absolute;z-index:20;display:flex;align-items:center;gap:10px;min-width:178px;max-width:250px;padding:10px 12px;border-radius:15px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,rgba(8,16,29,.88),rgba(2,7,14,.88));backdrop-filter:blur(13px);box-shadow:0 12px 28px rgba(0,0,0,.28);opacity:0;transform:translateY(10px)}.division-label .ico{width:34px;height:34px;flex:0 0 34px;border-radius:10px;border:1px solid rgba(255,255,255,.16);display:grid;place-items:center}.division-label b{font-size:12px;letter-spacing:.07em}.division-label small{display:block;margin-top:2px;color:rgba(255,255,255,.55);font-size:8px;letter-spacing:.12em;line-height:1.25}.division-label .arr{margin-left:auto;font-size:18px;color:rgba(255,255,255,.72)}.build-label{left:8%;bottom:3%}.build-label .ico{color:var(--gold)}.media-label{right:4%;bottom:4%}.media-label .ico{color:var(--violet)}.truck-label{left:50%;bottom:2%;transform:translate(-50%,10px);min-width:210px}.truck-label .ico{color:var(--blue)}.play .division-label{animation:labelIn .5s 3.0s var(--ease) both}.play .truck-label{animation:truckLabelIn .5s 3.08s var(--ease) both}.settled .division-label{opacity:1;transform:translateY(0)}.settled .truck-label{opacity:1;transform:translate(-50%,0)}@keyframes labelIn{to{opacity:1;transform:translateY(0)}}@keyframes truckLabelIn{to{opacity:1;transform:translate(-50%,0)}}
.topbar{position:absolute;z-index:40;left:max(17px,env(safe-area-inset-left));right:max(17px,env(safe-area-inset-right));top:max(13px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:16px;opacity:0}.brand-img{display:block;width:clamp(150px,18vw,230px);height:auto;filter:drop-shadow(0 5px 14px rgba(0,0,0,.28))}.quote-top{min-height:43px;display:grid;place-items:center;padding:0 17px;border:1px solid rgba(239,189,97,.55);border-radius:999px;background:rgba(4,10,20,.42);backdrop-filter:blur(11px);font-size:9px;font-weight:800;letter-spacing:.13em;text-decoration:none}.play .topbar{animation:uiIn .5s 3.14s var(--ease) both}.settled .topbar{opacity:1}@keyframes uiIn{to{opacity:1}}
.hero-copy{position:absolute;z-index:25;left:50%;bottom:2.8%;transform:translateX(-50%) translateY(10px);text-align:center;width:min(760px,88vw);opacity:0}.hero-copy h1{margin:0;font-size:clamp(25px,3.7vw,55px);letter-spacing:.18em;font-weight:500}.hero-copy h1 span:nth-child(2){color:var(--gold)}.hero-copy h1 span:nth-child(3){color:#78caff}.hero-copy p{margin:7px 0 0;font-size:clamp(7px,.9vw,11px);letter-spacing:.27em;color:rgba(255,255,255,.58)}.play .hero-copy{animation:copyIn .52s 3.22s var(--ease) both}.settled .hero-copy{opacity:1;transform:translateX(-50%)}@keyframes copyIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}
.travel{position:fixed;inset:0;z-index:15000;pointer-events:none;opacity:0;visibility:hidden;overflow:hidden;background:rgba(2,6,13,0)}.travel.active{opacity:1;visibility:visible}.travel-core{position:absolute;left:0;top:0;will-change:transform}.travel-core img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 34px rgba(78,177,255,.42))}.t-orbit,.t-orbit2{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(89,191,255,.55)}.t-orbit{width:110%;height:110%;animation:tspin .8s linear infinite}.t-orbit2{width:125%;height:125%;border-color:rgba(239,189,97,.42);animation:tspin2 .9s linear infinite}@keyframes tspin{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes tspin2{to{transform:translate(-50%,-50%) rotate(-360deg)}}.travel-flare{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.82),rgba(70,167,255,.35) 14%,rgba(239,189,97,.12) 27%,transparent 58%)}
@media(max-width:700px){.orbit-stage{top:26.8%;width:59vw}.build-link{left:-10%;bottom:27%;width:53vw}.dd-link{right:-9%;bottom:27.4%;width:51vw}.truck-link{left:50%;bottom:13.5%;width:58vw}.horizon{bottom:31%}.road{left:-34%;right:-34%;bottom:-12%;height:51%}.build-label{left:12%;bottom:2%;min-width:145px;max-width:165px}.media-label{right:4%;bottom:3%;min-width:145px;max-width:165px}.truck-label{bottom:0;min-width:180px;max-width:195px}.division-label{padding:8px 9px;gap:7px;border-radius:13px}.division-label .ico{width:29px;height:29px;flex-basis:29px}.division-label b{font-size:10px}.division-label small{font-size:6.4px}.division-label .arr{font-size:15px}.hero-copy{bottom:2.3%;width:94vw}.hero-copy h1{font-size:27px;letter-spacing:.135em}.hero-copy p{font-size:6.3px;letter-spacing:.21em}.brand-img{width:158px}.quote-top{padding:0 13px;font-size:8px}@keyframes globePullout{0%{left:50%;top:50%;width:136vw;transform:translate(-50%,-50%) scale(1.22);filter:brightness(1.12)}42%{transform:translate(-50%,-50%) scale(1.10)}100%{left:50%;top:26.8%;width:59vw;transform:translate(-50%,-50%) scale(1);filter:none}}}
@media(max-width:390px){.brand-img{width:146px}.quote-top{min-height:40px;padding:0 10px;font-size:7px}.build-link{left:-12%;width:55vw}.dd-link{right:-11%;width:53vw}.truck-link{width:61vw}.hero-copy h1{font-size:24px}}

<body>
<div class="loader" aria-hidden="true"></div>
<main class="app">
<section class="home" id="home">
  <div class="sky"></div><div class="stars"></div><div class="horizon"></div><div class="road"></div>
  <div class="scene" id="scene">
    <div class="orbit-stage" id="orbitStage"><div class="orbit"></div><div class="orbit2"></div><div class="orbit3"></div><img class="globe" id="homeGlobe" src="globe-opening.webp" alt="WAYFORTH globe"></div>
    <a class="build-link" href="build.html?from=home" data-page="build" aria-label="Open WAYFORTH Build">
      <img class="build-piece build-floor1" src="world-build.webp" alt=""><img class="build-piece build-floor2" src="world-build.webp" alt=""><img class="build-piece build-floor3" src="world-build.webp" alt=""><img class="build-piece build-floor4" src="world-build.webp" alt=""><img class="build-piece build-crane" src="world-build.webp" alt=""><img class="build-final" src="world-build.webp" alt="WAYFORTH Build">
      <i class="spark sp1"></i><i class="spark sp2"></i><i class="spark sp3"></i>
      <div class="division-label build-label"><span class="ico">▥</span><span><b>BUILD</b><small>REAL PROJECTS.<br>LASTING VALUE.</small></span><span class="arr">›</span></div>
    </a>
    <a class="dd-link" href="media.html?from=home" data-page="media" aria-label="Open WAYFORTH Media">
      <img class="dd-dark" src="world-dd.webp" alt=""><img class="dd-lit" src="world-dd.webp" alt="Digital Dynasty"><i class="soft-glow sg1"></i><i class="soft-glow sg2"></i><i class="camera-flash cf1"></i><i class="camera-flash cf2"></i>
      <div class="division-label media-label"><span class="ico">●</span><span><b>MEDIA</b><small>POWERED BY<br>DIGITAL DYNASTY.</small></span><span class="arr">›</span></div>
    </a>
    <a class="truck-link" href="trucking.html?from=home" data-page="trucking" aria-label="Open WAYFORTH Trucking">
      <img class="truck" src="world-truck.webp" alt="WAYFORTH Trucking"><i class="wheel wf"></i><i class="wheel wr1"></i><i class="wheel wr2"></i><i class="headlamp hl1"></i><i class="headlamp hl2"></i>
      <div class="division-label truck-label"><span class="ico">➜</span><span><b>TRUCKING</b><small>FREIGHT FORWARD.<br>OPPORTUNITY FURTHER.</small></span><span class="arr">›</span></div>
    </a>
    <nav class="topbar"><img class="brand-img" src="brand-logo.webp" alt="WAYFORTH"><a class="quote-top" href="quote.html?from=home" data-page="quote">GET A QUOTE →</a></nav>
    <div class="hero-copy"><h1><span>MOVE.</span> <span>BUILD.</span> <span>CREATE.</span></h1><p>DIFFERENT INDUSTRIES. A BRIGHTER TOMORROW.</p></div>
  </div>
</section>
<div class="travel" id="travel" aria-hidden="true"><div class="travel-core" id="travelCore"><div class="t-orbit"></div><div class="t-orbit2"></div><img src="globe-opening.webp" alt=""></div><div class="travel-flare" id="travelFlare"></div></div>
</main>
<script>
(()=>{
 const scene=document.getElementById('scene'),globe=document.getElementById('homeGlobe'),travel=document.getElementById('travel'),core=document.getElementById('travelCore'),flare=document.getElementById('travelFlare');let busy=false;
 const critical=[...document.images].filter(i=>['globe-opening.webp','world-build.webp','world-truck.webp','world-dd.webp','brand-logo.webp'].some(n=>i.src.endsWith(n)));
 function box(){const r=globe.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width}}
 function prep(b){core.style.left=b.x+'px';core.style.top=b.y+'px';core.style.width=b.w+'px';core.style.height=b.w+'px';core.style.transform='translate(-50%,-50%)'}
 function leave(url){if(busy)return;busy=true;const b=box(),dx=innerWidth/2-b.x,dy=innerHeight/2-b.y,scale=Math.hypot(innerWidth,innerHeight)/b.w*1.22;prep(b);travel.classList.add('active');scene.animate([{transform:'scale(1)',opacity:1,filter:'blur(0)'},{transform:'scale(1.045)',opacity:.78,filter:'blur(1px)'}],{duration:680,easing:'cubic-bezier(.35,.02,.15,1)',fill:'forwards'});core.animate([{transform:'translate(-50%,-50%) translate3d(0,0,0) scale(1)'},{transform:`translate(-50%,-50%) translate3d(${dx}px,${dy}px,0) scale(${scale})`}],{duration:720,easing:'cubic-bezier(.42,.02,.12,1)',fill:'forwards'});flare.animate([{opacity:0},{opacity:.08,offset:.42},{opacity:.82}],{duration:720,easing:'ease-in',fill:'forwards'});setTimeout(()=>location.href=url,700)}
 document.querySelectorAll('[data-page]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();leave(a.href)}));
 Promise.all(critical.map(i=>i.decode().catch(()=>{}))).then(()=>{document.body.classList.add('ready');const q=new URLSearchParams(location.search);if(q.has('return')){scene.classList.add('settled');requestAnimationFrame(()=>{const b=box(),dx=innerWidth/2-b.x,dy=innerHeight/2-b.y,scale=Math.hypot(innerWidth,innerHeight)/b.w*1.22;prep(b);travel.classList.add('active');core.style.transform=`translate(-50%,-50%) translate3d(${dx}px,${dy}px,0) scale(${scale})`;flare.style.opacity='.72';core.animate([{transform:`translate(-50%,-50%) translate3d(${dx}px,${dy}px,0) scale(${scale})`,opacity:1},{transform:'translate(-50%,-50%) translate3d(0,0,0) scale(1)',opacity:1,offset:.82},{transform:'translate(-50%,-50%) translate3d(0,0,0) scale(1)',opacity:0}],{duration:820,easing:'cubic-bezier(.18,.80,.16,1)',fill:'forwards'});flare.animate([{opacity:.72},{opacity:0}],{duration:700,easing:'ease-out',fill:'forwards'});setTimeout(()=>travel.classList.remove('active'),850);history.replaceState(null,'',location.pathname+'#home')})}else requestAnimationFrame(()=>requestAnimationFrame(()=>scene.classList.add('play')))});
