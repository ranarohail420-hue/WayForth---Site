<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060d">
<title>WAYFORTH — Move. Build. Create.</title>
<style>
:root{
  --gold:#efbd61; --blue:#58bfff; --ink:#02060d;
  --ease:cubic-bezier(.16,.84,.18,1);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:#fff;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,a{font:inherit;color:inherit}
body{overscroll-behavior:none}
.app{position:fixed;inset:0;overflow:hidden;background:#02060d}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;background:#02060d}
.view.active{opacity:1;visibility:visible;pointer-events:auto}
.frame{width:100%;height:100%;border:0;display:block;background:#02060d}

/* A predictable loading frame prevents the irregular first paint seen on iPhone. */
.loader{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:#02060d;
  transition:opacity .28s ease,visibility .28s ease}
.loader::before{content:"WAYFORTH";font-size:11px;font-weight:800;letter-spacing:.36em;color:rgba(255,255,255,.52);
  animation:loaderPulse 1.05s ease-in-out infinite alternate}
@keyframes loaderPulse{to{color:rgba(239,189,97,.92);text-shadow:0 0 24px rgba(239,189,97,.25)}}
body.assets-ready .loader{opacity:0;visibility:hidden}

/* HOME: genuine layered composition, not the flattened homepage picture. */
.home{isolation:isolate;background:#02060d}
.sky{position:absolute;inset:0;background:
  radial-gradient(circle at 50% 24%,rgba(31,87,177,.30),transparent 30%),
  radial-gradient(circle at 50% 66%,rgba(15,68,129,.13),transparent 34%),
  linear-gradient(180deg,#020713 0%,#061326 48%,#02060d 100%);
  overflow:hidden}
.sky::before{content:"";position:absolute;inset:-15%;background:url("home-ambient.webp") center/cover no-repeat;
  filter:blur(42px) saturate(1.4) brightness(.44);opacity:.56;transform:scale(1.18)}
.sky::after{content:"";position:absolute;inset:0;opacity:.42;background-image:
  radial-gradient(circle at 11% 13%,#fff 0 1px,transparent 1.4px),
  radial-gradient(circle at 77% 18%,#71c7ff 0 1px,transparent 1.5px),
  radial-gradient(circle at 32% 74%,#f2c56d 0 1px,transparent 1.4px),
  radial-gradient(circle at 86% 70%,#fff 0 1px,transparent 1.3px);
  background-size:170px 150px,240px 210px,285px 250px,325px 290px;
  animation:stars 13s linear infinite}
@keyframes stars{to{transform:translate3d(-18px,11px,0)}}

.scene{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity .22s ease}
body.assets-ready .scene{opacity:1}
.scene::after{content:"";position:absolute;z-index:8;left:3%;right:3%;bottom:7%;height:12%;
  background:linear-gradient(90deg,transparent,rgba(239,189,97,.26),rgba(77,176,255,.34),rgba(239,189,97,.22),transparent);
  filter:blur(18px);opacity:0}
.scene.play::after{animation:roadWake 2.1s 2.45s ease both}
@keyframes roadWake{0%{opacity:0;transform:scaleX(.20)}50%{opacity:.86;transform:scaleX(1)}100%{opacity:.32;transform:scaleX(1)}}

.orbit-stage{position:absolute;z-index:4;left:50%;top:39%;width:clamp(300px,38vw,590px);aspect-ratio:1;transform:translate(-50%,-50%)}
.globe{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:
  drop-shadow(0 0 32px rgba(63,161,255,.34)) drop-shadow(0 0 72px rgba(239,189,97,.13));
  transform:scale(1)}
.orbit,.orbit2{position:absolute;left:50%;top:50%;width:108%;aspect-ratio:1;border-radius:50%;
  border:1px solid rgba(94,185,255,.42);transform:translate(-50%,-50%) rotate(-13deg);
  box-shadow:0 0 32px rgba(69,164,255,.14)}
.orbit2{width:122%;border-color:rgba(239,189,97,.27);transform:translate(-50%,-50%) rotate(19deg)}
.scene.play .orbit{animation:orbitSpin 8s linear infinite}
.scene.play .orbit2{animation:orbitSpin2 10s linear infinite}
@keyframes orbitSpin{to{transform:translate(-50%,-50%) rotate(347deg)}}
@keyframes orbitSpin2{to{transform:translate(-50%,-50%) rotate(-341deg)}}

/* BUILD uses the transparent cutout in floor-like clips. No sky/background travels with it. */
.build-cluster{position:absolute;z-index:3;left:-2%;bottom:6%;width:min(45vw,690px);aspect-ratio:1}
.build-piece,.build-final{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 28px rgba(0,0,0,.38))}
.build-piece{opacity:0}
.build-floor1{clip-path:inset(67% 0 0 0)}
.build-floor2{clip-path:inset(49% 0 25% 0)}
.build-floor3{clip-path:inset(31% 0 44% 0)}
.build-floor4{clip-path:inset(13% 0 61% 0)}
.build-crane{clip-path:inset(0 0 72% 0)}
.build-final{opacity:0}
.scene.play .build-floor1{animation:buildIn .46s 1.02s var(--ease) both}
.scene.play .build-floor2{animation:buildIn .46s 1.27s var(--ease) both}
.scene.play .build-floor3{animation:buildIn .46s 1.52s var(--ease) both}
.scene.play .build-floor4{animation:buildIn .46s 1.77s var(--ease) both}
.scene.play .build-crane{animation:craneIn .58s 1.98s var(--ease) both}
.scene.play .build-final{animation:buildResolve .32s 2.42s ease-out both}
@keyframes buildIn{
  0%{opacity:0;transform:translate3d(-6%,12%,0) scale(.95);filter:brightness(1.36) blur(4px)}
  62%{opacity:1;transform:translate3d(0,-1%,0) scale(1.012);filter:brightness(1.08) blur(0)}
  100%{opacity:1;transform:none;filter:drop-shadow(0 20px 28px rgba(0,0,0,.38))}
}
@keyframes craneIn{
  0%{opacity:0;transform:translate3d(0,-18%,0) scale(.97);filter:brightness(1.42) blur(3px)}
  70%{opacity:1;transform:translate3d(0,1%,0);filter:brightness(1.08)}
  100%{opacity:1;transform:none;filter:none}
}
@keyframes buildResolve{from{opacity:0}to{opacity:1}}

/* A small suspended load gives the construction scene actual activity. */
.crane-load{position:absolute;z-index:5;left:43%;top:5%;width:18%;height:13%;opacity:0}
.crane-load::before{content:"";position:absolute;left:50%;top:-55%;width:1px;height:60%;background:rgba(239,189,97,.86)}
.crane-load::after{content:"";position:absolute;inset:45% 8% 0;border:1px solid rgba(239,189,97,.65);
  background:linear-gradient(180deg,rgba(244,205,124,.78),rgba(125,88,31,.92));box-shadow:0 0 16px rgba(239,189,97,.34)}
.scene.play .crane-load{animation:loadDrop 1.35s 2.10s var(--ease) both}
@keyframes loadDrop{0%{opacity:0;transform:translateY(-45%)}24%{opacity:1}70%{transform:translateY(35%)}100%{opacity:.72;transform:translateY(29%)}}

/* TRUCK is a real transparent cutout travelling into its final position. */
.truck{position:absolute;z-index:6;left:50%;bottom:3%;width:min(40vw,620px);transform:translateX(-50%);
  opacity:0;object-fit:contain;filter:drop-shadow(0 24px 30px rgba(0,0,0,.54))}
.scene.play .truck{animation:truckArrive 1.20s 2.13s cubic-bezier(.12,.90,.22,1) both}
@keyframes truckArrive{
  0%{opacity:0;transform:translate3d(-128%,-18%,0) scale(.27) rotate(-2.5deg);filter:blur(7px) brightness(1.25)}
  18%{opacity:.92}
  74%{transform:translate3d(-47%,1%,0) scale(1.035);filter:blur(0) brightness(1.08)}
  88%{transform:translate3d(-51%,0,0) scale(.995)}
  100%{opacity:1;transform:translate3d(-50%,0,0) scale(1);filter:drop-shadow(0 24px 30px rgba(0,0,0,.54))}
}
.headlight{position:absolute;z-index:7;left:50%;bottom:6%;width:18%;height:10%;transform:translateX(-50%);
  opacity:0;background:radial-gradient(ellipse at 50% 60%,rgba(106,207,255,.62),rgba(82,160,255,.14) 45%,transparent 72%);filter:blur(10px)}
.scene.play .headlight{animation:headlightOn .55s 3.06s ease both}
@keyframes headlightOn{0%{opacity:0}35%{opacity:.95}55%{opacity:.25}100%{opacity:.68}}

/* DD exists dark first, then powers on like a studio/storefront at night. */
.dd-wrap{position:absolute;z-index:3;right:-1%;bottom:6%;width:min(42vw,650px);aspect-ratio:1}
.dd-dark,.dd-lit{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.dd-dark{opacity:0;filter:brightness(.055) saturate(.22) contrast(1.15)}
.dd-lit{opacity:0;filter:brightness(1.02) saturate(1.03);filter:drop-shadow(0 18px 30px rgba(0,0,0,.42))}
.scene.play .dd-dark{animation:ddExist .35s 2.72s ease both}
.scene.play .dd-lit{animation:ddPower 1.12s 3.02s steps(1,end) both}
@keyframes ddExist{from{opacity:0}to{opacity:.82}}
@keyframes ddPower{
  0%{opacity:0;filter:brightness(.08)}
  12%{opacity:.72;filter:brightness(.62)}
  20%{opacity:.08}
  29%{opacity:.88;filter:brightness(.88)}
  38%{opacity:.19}
  48%{opacity:1;filter:brightness(1.05)}
  58%{opacity:.42}
  69%{opacity:1;filter:brightness(1.10)}
  100%{opacity:1;filter:drop-shadow(0 18px 30px rgba(0,0,0,.42))}
}
.dd-flash{position:absolute;z-index:7;right:10%;bottom:24%;width:18%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.82),rgba(77,170,255,.24) 35%,transparent 70%);opacity:0;filter:blur(6px)}
.scene.play .dd-flash{animation:studioFlash .68s 3.58s ease both}
@keyframes studioFlash{0%,22%{opacity:0}30%{opacity:1}42%{opacity:.05}56%{opacity:.78}100%{opacity:0}}

/* Globe starts close and lands into the final position. */
.scene.play .orbit-stage{animation:globePullout 1.18s .16s var(--ease) both}
@keyframes globePullout{
  0%{left:50%;top:50%;width:min(126vmin,1080px);transform:translate(-50%,-50%) scale(1.34);filter:brightness(1.13)}
  20%{transform:translate(-50%,-50%) scale(1.19)}
  46%{transform:translate(-50%,-50%) scale(1.23)}
  100%{left:50%;top:39%;width:clamp(300px,38vw,590px);transform:translate(-50%,-50%) scale(1);filter:none}
}

/* UI appears after the physical world has arrived. */
.topbar{position:absolute;z-index:30;left:max(20px,env(safe-area-inset-left));right:max(20px,env(safe-area-inset-right));
  top:max(15px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:18px;opacity:0}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.brand-mark{font-size:18px;color:var(--gold)}
.quote-top{min-height:44px;display:grid;place-items:center;padding:0 18px;border:1px solid rgba(239,189,97,.55);border-radius:999px;
  background:rgba(4,10,20,.44);backdrop-filter:blur(12px);font-size:10px;font-weight:800;letter-spacing:.13em;text-decoration:none}
.hero-copy{position:absolute;z-index:20;left:50%;bottom:15%;transform:translateX(-50%);text-align:center;width:min(760px,86vw);opacity:0}
.hero-copy h1{margin:0;font-size:clamp(26px,4vw,60px);letter-spacing:.19em;font-weight:500}
.hero-copy h1 span:nth-child(2){color:var(--gold)}
.hero-copy h1 span:nth-child(3){color:#78caff}
.hero-copy p{margin:9px 0 0;font-size:clamp(8px,1vw,12px);letter-spacing:.28em;color:rgba(255,255,255,.62)}
.choices{position:absolute;z-index:40;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;gap:10px;width:min(760px,92vw);opacity:0}
.choice{flex:1;min-width:0;min-height:58px;padding:11px 13px;border:1px solid rgba(255,255,255,.16);border-radius:18px;
  background:linear-gradient(180deg,rgba(9,20,37,.64),rgba(3,9,17,.70));backdrop-filter:blur(14px);text-decoration:none;
  display:flex;align-items:center;gap:10px;transition:transform .22s ease,border-color .22s ease,background .22s ease}
.choice b{font-size:12px;letter-spacing:.07em}.choice small{display:block;margin-top:2px;color:rgba(255,255,255,.47);font-size:8px;letter-spacing:.13em}
.choice .dot{width:30px;height:30px;flex:0 0 30px;border-radius:10px;border:1px solid rgba(255,255,255,.15);display:grid;place-items:center}
.choice-build .dot{color:var(--gold)} .choice-truck .dot{color:var(--blue)} .choice-media .dot{color:#8b94ff}
@media(hover:hover){.choice:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.34);background:rgba(13,26,45,.82)}}
.scene.play .topbar{animation:uiIn .60s 3.92s var(--ease) both}
.scene.play .hero-copy{animation:uiIn .62s 4.03s var(--ease) both}
.scene.play .choices{animation:uiIn .62s 4.13s var(--ease) both}
@keyframes uiIn{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
.hero-copy{transform:translateX(-50%) translateY(12px)}
.scene.play .hero-copy{animation:copyIn .62s 4.03s var(--ease) both}
@keyframes copyIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}
.choices{transform:translateX(-50%) translateY(12px)}
.scene.play .choices{animation:choicesIn .62s 4.13s var(--ease) both}
@keyframes choicesIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Final-state class is used after returning HOME so the intro doesn't replay. */
.scene.settled .orbit-stage,.scene.settled .build-cluster,.scene.settled .truck,.scene.settled .dd-wrap,
.scene.settled .topbar,.scene.settled .hero-copy,.scene.settled .choices{opacity:1}
.scene.settled .build-piece{opacity:1}
.scene.settled .build-final,.scene.settled .dd-lit{opacity:1}
.scene.settled .dd-dark{opacity:0}
.scene.settled .truck{transform:translateX(-50%)}
.scene.settled .topbar{transform:none}
.scene.settled .hero-copy{transform:translateX(-50%)}
.scene.settled .choices{transform:translateX(-50%)}

/* Travel overlay: same real globe expands from its actual screen position. */
.jump{position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0;visibility:hidden;overflow:hidden;background:#02060d;
  --accent:#58bfff}
.jump.active{opacity:1;visibility:visible}
.jump canvas{position:absolute;inset:0;width:100%;height:100%}
.jump-globe{position:absolute;object-fit:contain;filter:drop-shadow(0 0 36px color-mix(in srgb,var(--accent) 56%,transparent))}
.jump-wash{position:absolute;inset:0;opacity:0;background:
  radial-gradient(circle at 50% 50%,rgba(255,255,255,.88),color-mix(in srgb,var(--accent) 50%,transparent) 15%,rgba(4,10,23,.15) 36%,rgba(2,6,13,0) 60%)}
.jump-ring,.jump-ring2{position:absolute;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 65%,transparent)}
.jump-ring2{border-color:rgba(239,189,97,.42)}
.view.arriving .frame{animation:pageArrive .64s var(--ease) both}
@keyframes pageArrive{0%{transform:scale(1.045);filter:blur(6px) brightness(.78);opacity:.28}100%{transform:scale(1);filter:none;opacity:1}}

/* Mobile composition fills the whole screen instead of showing a small landscape strip. */
@media(max-width:700px){
  .orbit-stage{top:31%;width:74vw}
  .build-cluster{left:-24%;bottom:22%;width:74vw}
  .dd-wrap{right:-22%;bottom:22%;width:70vw}
  .truck{left:50%;bottom:15%;width:72vw}
  .headlight{bottom:18%;width:33%}
  .hero-copy{bottom:14%;width:92vw}
  .hero-copy h1{font-size:30px;letter-spacing:.14em}
  .hero-copy p{font-size:7px;letter-spacing:.22em}
  .choices{bottom:max(12px,env(safe-area-inset-bottom));gap:7px;width:94vw}
  .choice{min-height:68px;padding:9px 8px;border-radius:15px;gap:7px}
  .choice .dot{width:27px;height:27px;flex-basis:27px}
  .choice b{font-size:10px}.choice small{font-size:6.5px;letter-spacing:.10em}
  .brand{font-size:11px}.quote-top{padding:0 13px;font-size:8px}
  @keyframes globePullout{
    0%{left:50%;top:50%;width:142vw;transform:translate(-50%,-50%) scale(1.25);filter:brightness(1.12)}
    20%{transform:translate(-50%,-50%) scale(1.14)}
    46%{transform:translate(-50%,-50%) scale(1.18)}
    100%{left:50%;top:31%;width:74vw;transform:translate(-50%,-50%) scale(1);filter:none}
  }
}
@media(max-width:380px){
  .choice small{display:none}.choice{justify-content:center}.choice .dot{display:none}
  .hero-copy{bottom:16%}
}
@media(prefers-reduced-motion:reduce){
  .scene.play *{animation:none!important}
  .scene.play .orbit-stage,.scene.play .build-final,.scene.play .truck,.scene.play .dd-lit,
  .scene.play .topbar,.scene.play .hero-copy,.scene.play .choices{opacity:1!important}
  .scene.play .build-piece,.scene.play .dd-dark{display:none!important}
  .scene.play .truck{transform:translateX(-50%)!important}
}
</style>
</head>
<body>
<div class="loader" aria-hidden="true"></div>
<main class="app">
  <section class="view home active" id="homeView" aria-label="WAYFORTH home">
    <div class="sky"></div>
    <div class="scene" id="scene">
      <div class="orbit-stage" id="orbitStage">
        <div class="orbit"></div><div class="orbit2"></div>
        <img class="globe" id="homeGlobe" src="globe-opening.webp" alt="WAYFORTH globe">
      </div>

      <div class="build-cluster">
        <img class="build-piece build-floor1" src="world-build.webp" alt="">
        <img class="build-piece build-floor2" src="world-build.webp" alt="">
        <img class="build-piece build-floor3" src="world-build.webp" alt="">
        <img class="build-piece build-floor4" src="world-build.webp" alt="">
        <img class="build-piece build-crane" src="world-build.webp" alt="">
        <img class="build-final" src="world-build.webp" alt="WAYFORTH Build">
        <div class="crane-load"></div>
      </div>

      <img class="truck" src="world-truck.webp" alt="WAYFORTH Trucking">
      <div class="headlight"></div>

      <div class="dd-wrap">
        <img class="dd-dark" src="world-dd.webp" alt="">
        <img class="dd-lit" src="world-dd.webp" alt="Digital Dynasty">
      </div>
      <div class="dd-flash"></div>

      <nav class="topbar" aria-label="Primary">
        <div class="brand"><span class="brand-mark">WF</span> WAYFORTH</div>
        <a class="quote-top" href="#quote" data-page="quote">GET A QUOTE →</a>
      </nav>

      <div class="hero-copy">
        <h1><span>MOVE.</span> <span>BUILD.</span> <span>CREATE.</span></h1>
        <p>DIFFERENT INDUSTRIES. A BRIGHTER TOMORROW.</p>
      </div>

      <nav class="choices" aria-label="Choose a WAYFORTH division">
        <a class="choice choice-build" href="#build" data-page="build"><span class="dot">▥</span><span><b>BUILD</b><small>REAL PROJECTS. LASTING VALUE.</small></span></a>
        <a class="choice choice-truck" href="#trucking" data-page="trucking"><span class="dot">➜</span><span><b>TRUCKING</b><small>FREIGHT FORWARD.</small></span></a>
        <a class="choice choice-media" href="#media" data-page="media"><span class="dot">●</span><span><b>MEDIA</b><small>POWERED BY DIGITAL DYNASTY.</small></span></a>
      </nav>
    </div>
  </section>

  <section class="view" id="buildView"><iframe class="frame" id="buildFrame" title="WAYFORTH Build"></iframe></section>
  <section class="view" id="truckingView"><iframe class="frame" id="truckingFrame" title="WAYFORTH Trucking"></iframe></section>
  <section class="view" id="mediaView"><iframe class="frame" id="mediaFrame" title="WAYFORTH Media"></iframe></section>
  <section class="view" id="quoteView"><iframe class="frame" id="quoteFrame" title="WAYFORTH Quote"></iframe></section>

  <div class="jump" id="jump" aria-hidden="true">
    <canvas id="warp"></canvas>
    <div class="jump-wash" id="jumpWash"></div>
    <div class="jump-ring" id="jumpRing"></div>
    <div class="jump-ring2" id="jumpRing2"></div>
    <img class="jump-globe" id="jumpGlobe" src="globe-opening.webp" alt="">
  </div>
</main>
<script>
(()=>{
  const scene=document.getElementById('scene');
  const home=document.getElementById('homeView');
  const homeGlobe=document.getElementById('homeGlobe');
  const orbitStage=document.getElementById('orbitStage');
  const jump=document.getElementById('jump');
  const jumpGlobe=document.getElementById('jumpGlobe');
  const jumpRing=document.getElementById('jumpRing');
  const jumpRing2=document.getElementById('jumpRing2');
  const jumpWash=document.getElementById('jumpWash');
  const canvas=document.getElementById('warp');
  const ctx=canvas.getContext('2d');

  const views={home,build:document.getElementById('buildView'),trucking:document.getElementById('truckingView'),
    media:document.getElementById('mediaView'),quote:document.getElementById('quoteView')};
  const frames={build:document.getElementById('buildFrame'),trucking:document.getElementById('truckingFrame'),
    media:document.getElementById('mediaFrame'),quote:document.getElementById('quoteFrame')};
  const urls={build:'build.html',trucking:'trucking.html',media:'media.html',quote:'quote.html'};
  const themes={build:'#efbd61',trucking:'#58bfff',media:'#798dff',quote:'#efbd61'};
  let current='home',busy=false,raf=0;

  function resize(){
    const d=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);
    canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
    ctx.setTransform(d,0,0,d,0,0);
  }
  addEventListener('resize',resize,{passive:true});resize();

  function ensure(page,hash=''){
    const f=frames[page];if(!f)return;
    if(!f.getAttribute('src'))f.setAttribute('src',urls[page]+hash);
    else if(hash){try{f.contentWindow.location.hash=hash}catch(_){f.setAttribute('src',urls[page]+hash)}}
  }
  function show(page){
    Object.values(views).forEach(v=>v.classList.remove('active','arriving'));
    views[page].classList.add('active','arriving');
    setTimeout(()=>views[page].classList.remove('arriving'),700);
    current=page;
  }
  function globeBox(){
    const r=homeGlobe.getBoundingClientRect();
    return{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width};
  }
  const particles=Array.from({length:78},(_,i)=>({
    a:i/78*Math.PI*2+Math.sin(i*1.7)*.1,k:.30+((i*37)%100)/100*.84,
    o:.20+((i*19)%100)/100*.72,w:.6+((i*13)%3)
  }));
  function hex(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
  function warp(origin,accent,reverse=false,duration=930){
    cancelAnimationFrame(raf);const start=performance.now(),c=hex(accent);
    function tick(now){
      let q=Math.min(1,(now-start)/duration),p=reverse?1-q:q,boost=Math.pow(p,1.55);
      ctx.clearRect(0,0,innerWidth,innerHeight);ctx.lineCap='round';
      const cx=origin.x+(innerWidth/2-origin.x)*p,cy=origin.y+(innerHeight/2-origin.y)*p;
      particles.forEach(pt=>{
        const r=10+pt.k*40+boost*48,len=20+boost*(160+pt.k*340);
        const x1=cx+Math.cos(pt.a)*r,y1=cy+Math.sin(pt.a)*r*.72;
        const x2=cx+Math.cos(pt.a)*(r+len),y2=cy+Math.sin(pt.a)*(r+len)*.72;
        ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${Math.min(.82,pt.o*(.10+boost))})`;
        ctx.lineWidth=pt.w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      });
      if(q<1)raf=requestAnimationFrame(tick);
    }raf=requestAnimationFrame(tick);
  }
  function prepJump(box,accent){
    jump.style.setProperty('--accent',accent);
    [jumpGlobe,jumpRing,jumpRing2].forEach(el=>{
      el.style.left=box.x+'px';el.style.top=box.y+'px';
      el.style.transform='translate(-50%,-50%)';
    });
    jumpGlobe.style.width=box.w+'px';
    jumpRing.style.width=box.w*1.08+'px';jumpRing.style.height=box.w*1.08+'px';
    jumpRing2.style.width=box.w*1.22+'px';jumpRing2.style.height=box.w*1.22+'px';
  }
  function go(page,hash=''){
    if(busy||page===current)return;busy=true;ensure(page,hash);
    const box=globeBox(),accent=themes[page]||themes.build,diag=Math.hypot(innerWidth,innerHeight)*1.75;
    prepJump(box,accent);jump.classList.add('active');warp(box,accent,false);
    scene.animate([{transform:'scale(1)',filter:'blur(0)',opacity:1},
      {transform:'scale(1.08)',opacity:.96,offset:.38},{transform:'scale(1.55)',filter:'blur(3px)',opacity:.12}],
      {duration:850,easing:'cubic-bezier(.48,.02,.12,1)',fill:'forwards'});
    jumpGlobe.animate([{left:box.x+'px',top:box.y+'px',width:box.w+'px',opacity:1},
      {left:'50%',top:'50%',width:diag+'px',opacity:1,transform:'translate(-50%,-50%) scale(1.05)'}],
      {duration:900,easing:'cubic-bezier(.45,.02,.11,1)',fill:'forwards'});
    jumpRing.animate([{left:box.x+'px',top:box.y+'px',width:box.w*1.08+'px',height:box.w*1.08+'px',opacity:.45,transform:'translate(-50%,-50%) rotate(-13deg)'},
      {left:'50%',top:'50%',width:diag*.84+'px',height:diag*.84+'px',opacity:0,transform:'translate(-50%,-50%) rotate(290deg)'}],
      {duration:860,easing:'cubic-bezier(.30,.04,.13,1)',fill:'forwards'});
    jumpRing2.animate([{left:box.x+'px',top:box.y+'px',width:box.w*1.22+'px',height:box.w*1.22+'px',opacity:.34,transform:'translate(-50%,-50%) rotate(19deg)'},
      {left:'50%',top:'50%',width:diag*.94+'px',height:diag*.94+'px',opacity:0,transform:'translate(-50%,-50%) rotate(-250deg)'}],
      {duration:920,easing:'cubic-bezier(.30,.04,.13,1)',fill:'forwards'});
    jumpWash.animate([{opacity:0},{opacity:.10,offset:.36},{opacity:.82,offset:.72},{opacity:1}],
      {duration:850,easing:'ease-in-out',fill:'forwards'});
    setTimeout(()=>show(page),640);
    setTimeout(()=>{
      jump.animate([{opacity:1},{opacity:0}],{duration:250,fill:'forwards'}).finished.then(()=>{
        jump.classList.remove('active');jump.style.opacity='';
        [scene,jumpGlobe,jumpRing,jumpRing2,jumpWash].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
        history.replaceState(null,'','#'+page);busy=false;
      });
    },900);
  }
  function homeBack(){
    if(busy||current==='home')return;busy=true;
    const from=current,box=globeBox(),accent=themes[from]||'#58bfff',diag=Math.hypot(innerWidth,innerHeight)*1.75;
    prepJump(box,accent);jump.classList.add('active');jump.style.opacity='1';
    Object.assign(jumpGlobe.style,{left:'50%',top:'50%',width:diag+'px',opacity:'1'});
    warp(box,accent,true,940);
    show('home');scene.classList.remove('play');scene.classList.add('settled');
    jumpGlobe.animate([{left:'50%',top:'50%',width:diag+'px',opacity:1},
      {left:box.x+'px',top:box.y+'px',width:box.w+'px',opacity:.94,offset:.82},
      {left:box.x+'px',top:box.y+'px',width:box.w+'px',opacity:0}],
      {duration:980,easing:'cubic-bezier(.18,.80,.16,1)',fill:'forwards'});
    jumpWash.animate([{opacity:1},{opacity:.55,offset:.35},{opacity:0}],
      {duration:920,easing:'ease-out',fill:'forwards'});
    setTimeout(()=>{
      jump.animate([{opacity:1},{opacity:0}],{duration:220,fill:'forwards'}).finished.then(()=>{
        jump.classList.remove('active');jump.style.opacity='';
        [jumpGlobe,jumpRing,jumpRing2,jumpWash].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
        history.replaceState(null,'','#home');busy=false;
      })
    },960);
  }

  document.querySelectorAll('[data-page]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go(a.dataset.page)}));
  addEventListener('message',e=>{
    if(e.origin!==location.origin||!e.data||e.data.type!=='wf-nav')return;
    if(e.data.page==='home')homeBack();else go(e.data.page,e.data.hash||'');
  });

  /* Wait for all motion-critical assets before the first frame. This fixes the irregular start. */
  const critical=[...document.images].filter(i=>['globe-opening.webp','world-build.webp','world-truck.webp','world-dd.webp'].some(n=>i.src.endsWith(n)));
  Promise.all(critical.map(i=>i.decode().catch(()=>{}))).then(()=>{
    document.body.classList.add('assets-ready');
    requestAnimationFrame(()=>requestAnimationFrame(()=>scene.classList.add('play')));
    setTimeout(()=>{ensure('build');ensure('trucking')},3000);
    setTimeout(()=>{ensure('media');ensure('quote')},4100);
  });

  const initial=location.hash.replace('#','');
  if(['build','trucking','media','quote'].includes(initial)){
    Promise.all(critical.map(i=>i.decode().catch(()=>{}))).then(()=>{
      document.body.classList.add('assets-ready');scene.classList.add('settled');
      ensure(initial);setTimeout(()=>show(initial),80);
    });
  }
})();
</script>
</body>
</html>
