.travel.go .r1{animation:wfRibbon1 .78s cubic-bezier(.35,.02,.10,1) both}.travel.go .r2{animation:wfRibbon2 .78s cubic-bezier(.35,.02,.10,1) both}.travel.go .r3{animation:wfRibbon3 .78s cubic-bezier(.35,.02,.10,1) both}
@keyframes wfAtmoDive{0%{opacity:0;transform:translate(-50%,-50%) scale(.08)}38%{opacity:.35}74%{opacity:.94;transform:translate(-50%,-50%) scale(.72)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes wfGridDive{0%{opacity:0;transform:translate(-50%,-50%) scale(.22) rotate(0)}30%{opacity:.35}100%{opacity:.68;transform:translate(-50%,-50%) scale(1.15) rotate(95deg)}}
@keyframes wfRibbon1{0%{opacity:0;transform:translate(-50%,-50%) scale(.20) rotate(-18deg)}24%{opacity:.74}100%{opacity:.10;transform:translate(-50%,-50%) scale(1.42) rotate(148deg)}}
@keyframes wfRibbon2{0%{opacity:0;transform:translate(-50%,-50%) scale(.20) rotate(58deg)}24%{opacity:.64}100%{opacity:.08;transform:translate(-50%,-50%) scale(1.48) rotate(-130deg)}}
@keyframes wfRibbon3{0%{opacity:0;transform:translate(-50%,-50%) scale(.18) rotate(-39deg)}24%{opacity:.56}100%{opacity:.06;transform:translate(-50%,-50%) scale(1.54) rotate(126deg)}}
.travel.reverse .travel-atmo{opacity:1;transform:translate(-50%,-50%) scale(1);animation:wfAtmoReturn .92s cubic-bezier(.16,.82,.15,1) both}.travel.reverse .travel-grid{opacity:.56;transform:translate(-50%,-50%) scale(1.08) rotate(85deg);animation:wfGridReturn .92s ease-out both}.travel.reverse .travel-ribbon{opacity:.18}.travel.reverse .r1{animation:wfRibbonReturn1 .92s ease-out both}.travel.reverse .r2{animation:wfRibbonReturn2 .92s ease-out both}.travel.reverse .r3{animation:wfRibbonReturn3 .92s ease-out both}@keyframes wfAtmoReturn{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}72%{opacity:.55;transform:translate(-50%,-50%) scale(.34)}100%{opacity:0;transform:translate(-50%,-50%) scale(.10)}}@keyframes wfGridReturn{to{opacity:0;transform:translate(-50%,-50%) scale(.28) rotate(0)}}@keyframes wfRibbonReturn1{to{opacity:0;transform:translate(-50%,-50%) scale(.22) rotate(-18deg)}}@keyframes wfRibbonReturn2{to{opacity:0;transform:translate(-50%,-50%) scale(.22) rotate(58deg)}}@keyframes wfRibbonReturn3{to{opacity:0;transform:translate(-50%,-50%) scale(.20) rotate(-39deg)}}
</style>
<script>if(new URLSearchParams(location.search).has("return"))document.documentElement.classList.add("wf-returning-home");</script>
</head>
<body>
<div class="loader" aria-hidden="true"></div>
<main class="app">
<section class="home" id="home">
  <div class="sky"></div><div class="atmo"></div><div class="stars"></div><div class="horizon"></div><div class="road"></div>
  <div class="scene" id="scene">
    <div class="orbit-stage" id="orbitStage"><div class="orbit"></div><div class="orbit2"></div><div class="orbit3"></div><img class="globe" id="homeGlobe" src="globe-opening.webp" alt="WAYFORTH globe"></div>
    <a class="build-link" href="build.html?from=home" data-page="build" aria-label="Open WAYFORTH Build">
      <img class="build-piece build-floor1" src="world-build.webp" alt=""><img class="build-piece build-floor2" src="world-build.webp" alt=""><img class="build-piece build-floor3" src="world-build.webp" alt=""><img class="build-piece build-floor4" src="world-build.webp" alt=""><img class="build-piece build-crane" src="world-build.webp" alt=""><img class="build-final" src="world-build.webp" alt="WAYFORTH Build">
      <i class="spark sp1"></i><i class="spark sp2"></i><i class="spark sp3"></i>
      <div class="division-label build-label"><span class="ico">▥</span><span><b>BUILD</b><small>REAL PROJECTS.<br>LASTING VALUE.</small></span><span class="arr">›</span></div>
    </a>
    <a class="dd-link" href="media.html?from=home" data-page="media" aria-label="Open WAYFORTH Media">
      <img class="dd-dark" src="world-dd.webp" alt=""><img class="dd-lit" src="world-dd.webp" alt="Digital Dynasty"><i class="soft-glow sg1"></i><i class="soft-glow sg2"></i><i class="camera-flash cf1"></i><i class="camera-flash cf2"></i>
      <div class="division-label media-label"><span class="ico">●</span><span><b>MEDIA</b><small>POWERED BY<br>DIGITAL DYNASTY.</small></span><span class="arr">›</span></div>
    </a>
    <a class="truck-link" href="trucking.html?from=home" data-page="trucking" aria-label="Open WAYFORTH Trucking">
      <img class="truck" src="world-truck.webp" alt="WAYFORTH Trucking"><i class="wheel wf"></i><i class="wheel wr1"></i><i class="wheel wr2"></i><i class="headlamp hl1"></i><i class="headlamp hl2"></i>
      <div class="division-label truck-label"><span class="ico">➜</span><span><b>TRUCKING</b><small>FREIGHT FORWARD.<br>OPPORTUNITY FURTHER.</small></span><span class="arr">›</span></div>
    </a>
    <nav class="topbar"><img class="brand-img" src="brand-logo.webp" alt="WAYFORTH"><a class="quote-top" href="quote.html?from=home" data-page="quote">GET A QUOTE →</a></nav>
    <div class="hero-copy"><h1><span>MOVE.</span> <span>BUILD.</span> <span>CREATE.</span></h1><p>DIFFERENT INDUSTRIES. A BRIGHTER TOMORROW.</p></div>
  </div>
</section>
<div class="travel" id="travel" aria-hidden="true"><div class="travel-atmo"></div><div class="travel-grid"></div><i class="travel-ribbon r1"></i><i class="travel-ribbon r2"></i><i class="travel-ribbon r3"></i><div class="travel-core" id="travelCore"><div class="t-orbit"></div><div class="t-orbit2"></div><img src="globe-opening.webp" alt=""></div><div class="travel-flare" id="travelFlare"></div></div>
</main>
<script>
(()=>{
 const scene=document.getElementById('scene'),globe=document.getElementById('homeGlobe'),travel=document.getElementById('travel'),core=document.getElementById('travelCore'),flare=document.getElementById('travelFlare');
 let busy=false;

 function syncViewport(){
   const vv=window.visualViewport;
   const w=Math.round(vv ? vv.width : innerWidth), h=Math.round(vv ? vv.height : innerHeight);
   document.documentElement.style.setProperty('--app-w',w+'px');
   document.documentElement.style.setProperty('--app-h',h+'px');
 }
 syncViewport();
 (visualViewport||window).addEventListener('resize',syncViewport,{passive:true});
 window.addEventListener('orientationchange',()=>setTimeout(syncViewport,120),{passive:true});

 /* Prevent accidental iOS pinch/double-zoom from breaking fixed layers. */
 ['gesturestart','gesturechange','gestureend'].forEach(type=>{
   document.addEventListener(type,e=>e.preventDefault(),{passive:false});
 });
 document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});

 const critical=[...document.images].filter(i=>[
   'globe-opening.webp','world-build.webp','world-truck.webp','world-dd.webp','brand-logo.webp'
 ].some(n=>i.src.endsWith(n)));

 function box(){
   const r=globe.getBoundingClientRect();
   return{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width};
 }
 function prep(b){
   core.style.left=b.x+'px';core.style.top=b.y+'px';
   core.style.width=b.w+'px';core.style.height=b.w+'px';
   core.style.transform='translate3d(-50%,-50%,0) scale(1)';
 }
 function warm(url){try{fetch(url,{cache:'force-cache',credentials:'same-origin'}).catch(()=>{})}catch(_){}}

 function leave(url){
   if(busy)return;
   busy=true;
   document.documentElement.classList.add('leaving');
   const b=box(),vw=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--app-w'))||innerWidth,
         vh=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--app-h'))||innerHeight,
         dx=vw/2-b.x,dy=vh/2-b.y,scale=Math.min(3.25,Math.max(2.35,(Math.min(vw,vh)*1.45)/b.w));

   prep(b);
   travel.classList.add('active','go');

   /* Only transform/opacity during the handoff — no filters, less Safari GPU pressure. */
   scene.animate([
     {transform:'translate3d(0,0,0) scale(1)',opacity:1},
     {transform:'translate3d(0,0,0) scale(1.012)',opacity:.98,offset:.58},
     {transform:'translate3d(0,0,0) scale(1.025)',opacity:.72}
   ],{duration:760,easing:'cubic-bezier(.36,.02,.12,1)',fill:'forwards'});

   core.animate([
     {transform:'translate3d(-50%,-50%,0) translate3d(0,0,0) scale(1)',opacity:1},
     {transform:`translate3d(-50%,-50%,0) translate3d(${dx}px,${dy}px,0) scale(${scale*.78})`,opacity:1,offset:.72},
     {transform:`translate3d(-50%,-50%,0) translate3d(${dx}px,${dy}px,0) scale(${scale})`,opacity:1}
   ],{duration:760,easing:'cubic-bezier(.42,.02,.10,1)',fill:'forwards'});

   flare.animate([
     {opacity:0},{opacity:.10,offset:.38},{opacity:.62,offset:.72},{opacity:1}
   ],{duration:760,easing:'ease-in',fill:'forwards'});

   /* Navigate only after the screen is fully covered. */
   setTimeout(()=>{location.assign(url)},720);
 }

 document.querySelectorAll('[data-page]').forEach(a=>a.addEventListener('click',e=>{
   e.preventDefault(); leave(a.href);
 }));

 Promise.all(critical.map(i=>i.decode().catch(()=>{}))).then(()=>{
   document.body.classList.add('ready');
   const q=new URLSearchParams(location.search);
   if(q.has('return')){
     scene.classList.add('settled');
     requestAnimationFrame(()=>{
       const b=box(),vw=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--app-w'))||innerWidth,
             vh=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--app-h'))||innerHeight,
             dx=vw/2-b.x,dy=vh/2-b.y,scale=Math.min(3.25,Math.max(2.35,(Math.min(vw,vh)*1.45)/b.w));
       prep(b);
       travel.classList.add('active','reverse');
       core.style.transform=`translate3d(-50%,-50%,0) translate3d(${dx}px,${dy}px,0) scale(${scale})`;
       flare.style.opacity='1';

       core.animate([
         {transform:`translate3d(-50%,-50%,0) translate3d(${dx}px,${dy}px,0) scale(${scale})`,opacity:1},
         {transform:`translate3d(-50%,-50%,0) translate3d(${dx*.12}px,${dy*.12}px,0) scale(1.15)`,opacity:1,offset:.78},
         {transform:'translate3d(-50%,-50%,0) translate3d(0,0,0) scale(1)',opacity:0}
       ],{duration:940,easing:'cubic-bezier(.16,.82,.15,1)',fill:'forwards'});
       flare.animate([{opacity:1},{opacity:.35,offset:.62},{opacity:0}],
         {duration:880,easing:'ease-out',fill:'forwards'});
       setTimeout(()=>{
         travel.classList.remove('active','reverse');
         history.replaceState(null,'',location.pathname+'#home');
         document.documentElement.classList.remove('wf-returning-home');
       },960);
     });
   }else{
     requestAnimationFrame(()=>requestAnimationFrame(()=>scene.classList.add('play')));
   }

   setTimeout(()=>{warm('build.html');warm('trucking.html')},2500);
   setTimeout(()=>{warm('media.html');warm('quote.html')},3400);
 });
})();
</script>
</body></html>
