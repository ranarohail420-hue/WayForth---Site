<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WAYFORTH — Build. Move. Create.</title>
<meta name="description" content="WAYFORTH brings construction, trucking and media under one company. Build. Move. Create.">
<meta name="theme-color" content="#04070f">
<link rel="icon" href="wf-actual-logo-decal.png">
<link rel="preload" href="wf-home-scene-hd.webp" as="image">
<link rel="stylesheet" href="wf-header.css?v=42">
<script src="wf-guide.js?v=42"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Manrope:wght@400;500;700&display=swap">
<style>
/* WAYFORTH V40 — Circle Reveal (no logo), preloaded pages, real welding/headlight/camera effects. Based on V38 — Option 3 "Three Worlds" home. Standalone: no dependency on the old index/app/scenes files. */
:root{
  --ink:#04070f;--line:rgba(170,195,235,.18);--text:#f2f4fa;--muted:#a3b0c8;
  --gold:#f2b84b;--gold-2:#ffd98a;--blue:#3fa2ff;--violet:#a46bff;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;--body:"Manrope","Segoe UI",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}

/* ---------- top bar ---------- */
.nav{position:fixed;z-index:15;top:0;left:0;right:0;transition:opacity .4s}
.brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.brand img{width:46px;height:auto;user-select:none;-webkit-user-drag:none}
.brand,.nav{user-select:none;-webkit-user-select:none}
::selection{background:rgba(242,184,75,.35)}
.brand b{font:600 15px/1 var(--display);font-stretch:125%;letter-spacing:.32em}
.links{display:flex;gap:26px;margin-left:auto;font-size:13px;letter-spacing:.06em}
.links button{background:none;border:0;padding:4px 0;cursor:pointer;color:var(--muted);transition:color .2s}
.links button:hover{color:var(--text)}
.quote{border:1px solid rgba(242,184,75,.7);color:var(--gold-2);background:rgba(242,184,75,.06);padding:11px 18px;border-radius:999px;
  font-size:12px;font-weight:700;letter-spacing:.12em;cursor:pointer;white-space:nowrap;transition:background .25s,box-shadow .25s}
.quote:hover{background:rgba(242,184,75,.16);box-shadow:0 0 24px rgba(242,184,75,.3)}
body.in-page .nav{opacity:0;pointer-events:none}

/* ---------- home: three worlds over one continuous scene ---------- */
#home{position:fixed;inset:0;display:flex;background:var(--ink);transition:opacity .6s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
body.in-page #home{pointer-events:none}
.w{container-type:inline-size;position:relative;flex:1;min-width:0;overflow:hidden;cursor:pointer;border:0;padding:0;margin:0;text-align:left;background:none;
  transition:flex 1s cubic-bezier(.2,.8,.2,1)}
.w + .w{border-left:1px solid rgba(255,255,255,.08)}
.seg{position:absolute;top:var(--st,64px);left:0;width:var(--sw,100vw);max-width:none;height:auto;pointer-events:none;user-select:none;
  filter:brightness(.92) saturate(1.05);transition:filter .8s;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 3%,#000 90%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 3%,#000 90%,transparent 100%)}
#home:before{content:"";position:absolute;inset:-40px;background:url("wf-home-scene-hd.webp") center/cover;filter:blur(40px) brightness(.35) saturate(1.2);pointer-events:none}
#home:has(.w:hover) .seg{filter:brightness(.45) saturate(.7)}
#home .w:hover .seg,#home .w:focus-visible .seg{filter:brightness(1.05) saturate(1.15)}
#home:has(.w:hover) .w{flex:.75}
#home .w:hover,#home .w:focus-visible{flex:1.9}
.w:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(4,7,15,.92) 0%,rgba(4,7,15,.35) 22%,transparent 40%)}
.fx{position:absolute;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}
.copy{position:absolute;z-index:2;left:clamp(18px,3vw,44px);right:clamp(18px,3vw,44px);bottom:calc(clamp(34px,6vh,56px) + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.eyebrow{font-size:clamp(10px,1.45vh,12px);font-weight:700;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.copy h2{margin:0;font:900 clamp(30px,min(15cqi,10.5vh),96px)/.86 var(--display);font-stretch:110%;letter-spacing:-.02em;transition:font-stretch .8s}
.w:hover h2{font-stretch:125%}
.copy p{margin:0;max-width:38ch;color:#c9d3e6;font-size:15px;line-height:1.55;opacity:0;max-height:0;overflow:hidden;transform:translateY(12px);transition:all .6s .15s}
.copy .go{justify-self:start;font-size:12px;font-weight:800;letter-spacing:.14em;padding:0 20px;max-height:0;overflow:hidden;line-height:40px;border-radius:999px;color:var(--ink);opacity:0;transform:translateY(12px);transition:all .6s .25s}
.w:hover .copy p,.w:hover .copy .go,.w:focus-visible .copy p,.w:focus-visible .copy .go{opacity:1;transform:none;max-height:140px}
.bar{position:absolute;z-index:2;left:0;right:0;bottom:0;height:3px;transform:scaleX(0);transform-origin:left;transition:transform .8s}
.w:hover .bar{transform:scaleX(1)}
.gold-bg{background:linear-gradient(180deg,var(--gold-2),var(--gold))}.blue-bg{background:linear-gradient(180deg,#9fd3ff,var(--blue))}.violet-bg{background:linear-gradient(180deg,#d6bcff,var(--violet))}
.t-gold{color:var(--gold)}.t-blue{color:var(--blue)}.t-violet{color:var(--violet)}
.tagline{position:fixed;z-index:3;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);pointer-events:none;transition:opacity .4s}
body.in-page .tagline{opacity:0}

/* first load */
.w{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
.w:nth-child(2){animation-delay:.12s}.w:nth-child(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}

/* ---------- section pages (Build / Trucking / Media) ---------- */
#page{position:fixed;inset:0;z-index:20;visibility:hidden;pointer-events:none;background:var(--ink);will-change:clip-path}
body.in-page #page,body.closing #page{visibility:visible}
body.in-page #page{pointer-events:auto}
body.busy #home,body.busy .nav{pointer-events:none}
.ring{position:fixed;z-index:24;border-radius:50%;pointer-events:none;border:2px solid var(--rc);box-shadow:0 0 40px var(--rc),inset 0 0 40px var(--rc);transform:translate(-50%,-50%)}
#page iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--ink);visibility:hidden}
#page iframe.on{visibility:visible}
.fxall{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
@keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
.loader{position:fixed;z-index:26;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px solid rgba(242,184,75,.2);border-top-color:var(--gold);animation:spin .8s linear infinite;display:none}
body.loading:not(.in-page) .loader{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- dialogs ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:20px;background:rgba(2,6,13,.78);backdrop-filter:blur(12px)}
.overlay.open{display:grid}
.dlg{width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;border:1px solid rgba(240,199,122,.45);border-radius:20px;padding:clamp(22px,4vw,34px);
  background:linear-gradient(140deg,#0b294b,#020813);box-shadow:0 20px 95px #0009;display:grid;gap:16px}
.dlg h3{margin:0;font:800 clamp(24px,3vw,34px)/1.05 var(--display);font-stretch:115%}
.dlg p{margin:0;line-height:1.6;color:#b9c8da}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.choice{display:grid;gap:6px;padding:16px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;text-align:left}
.choice b{font:800 15px/1 var(--display);font-stretch:118%;letter-spacing:.1em}
.choice small{font-size:12px;color:var(--muted);line-height:1.4}
.choice:hover{border-color:currentColor;background:rgba(255,255,255,.06)}
.dlg form{display:grid;gap:12px}
.dlg label{display:grid;gap:6px;font-size:12px;font-weight:700;color:#ffd078;letter-spacing:.03em}
.dlg input,.dlg textarea,.dlg select{width:100%;border:1px solid rgba(93,156,207,.42);border-radius:12px;background:rgba(4,24,43,.72);color:#f5f9fd;padding:12px 14px;font:inherit;font-size:14px}
.dlg textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:800;font-size:12px;letter-spacing:.12em;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#14100b}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.status{font-size:13px;min-height:1em}.status.ok{color:#7be2a6}.status.err{color:#ff9d8a}

.toast{position:fixed;z-index:80;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);opacity:0;transition:all .35s;
  background:rgba(8,14,30,.92);border:1px solid var(--line);padding:12px 18px;border-radius:12px;font-size:13px;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- phones / narrow screens ---------- */
@media (max-width:900px){
  .links{display:none}.quote{margin-left:auto;padding:10px 14px}
  #home{flex-direction:column}
  .w + .w{border-left:0;border-top:1px solid rgba(255,255,255,.08)}
  .seg{top:50%!important;width:300vw!important;transform:translateY(-55%);-webkit-mask-image:none;mask-image:none}
  #home .w:hover,#home .w:focus-visible,#home:has(.w:hover) .w{flex:1}
  .copy{bottom:16px}.copy p{display:none}.copy .go{opacity:1;transform:none;padding:9px 14px;font-size:11px}
  .copy h2{font-size:clamp(34px,12vw,60px)}
  .tagline{display:none}
  .choices{grid-template-columns:1fr}.row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="nav wfh" id="hdr"><div class="wfh-bar">
  <button class="wfh-logo" data-open="home" aria-label="WAYFORTH home"><img src="wf-hdr-logo.png" alt="WAYFORTH"></button>
  <nav class="wfh-nav" aria-label="Primary">
    <button class="on" data-open="home">Home</button>
    <button data-aux="about">About Us</button>
    <div class="wfh-dd" id="svc"><button aria-haspopup="true" aria-expanded="false" id="svcBtn">Services</button>
      <div class="wfh-menu" role="menu"><button role="menuitem" data-open="build">Build <small>Construction material</small></button><button role="menuitem" data-open="trucking">Trucking <small>Cars, freight, loads</small></button><button role="menuitem" data-open="media">Media <small>Creators &amp; revenue</small></button></div></div>
    <button data-aux="contact">Contact Us</button>
  </nav>
  <button class="wfh-quote" data-open="quote" aria-label="Get a quote"><img src="wf-hdr-quote.png" alt=""></button>
</div></header>

<main id="home" aria-label="WAYFORTH — choose a division">
  <canvas class="fxall" id="fxall" aria-hidden="true"></canvas>
  <button class="w" data-open="build" aria-label="Build — construction and materials">
    <img class="seg" src="wf-home-scene-hd.webp" alt="" draggable="false">
    <span class="copy"><span class="eyebrow t-gold">Construction Material · Lahore</span><h2>BUILD</h2>
      <p>Residential plots from 5 marla to 2 kanal, plus commercial bulk orders. Pick your materials and get one clear quote.</p>
      <span class="go gold-bg">EXPLORE BUILD →</span></span><span class="bar gold-bg"></span>
  </button>
  <button class="w" data-open="trucking" aria-label="Move — trucking and transport">
    <img class="seg" src="wf-home-scene-hd.webp" alt="" draggable="false">
    <span class="copy"><span class="eyebrow t-blue">Ship Car's · Freight &amp; Find Loads</span><h2>MOVE</h2>
      <p>Cars, boats and freight across the US, with a trucker network behind every load.</p>
      <span class="go blue-bg">GET A QUOTE →</span></span><span class="bar blue-bg"></span>
  </button>
  <button class="w" data-open="media" aria-label="Create — WAYFORTH Media">
    <img class="seg" src="wf-home-scene-hd.webp" alt="" draggable="false">
    <span class="copy"><span class="eyebrow t-violet">Empowering Creators, Maximizing Revenue</span><h2>CREATE</h2>
      <p>Channels, content and production that turn attention into an audience.</p>
      <span class="go violet-bg">SEE MEDIA →</span></span><span class="bar violet-bg"></span>
  </button>
</main>
<p class="tagline">Different industries. A brighter tomorrow.</p>

<section id="page" aria-live="polite"></section>
<div class="loader" aria-hidden="true"></div>

<!-- Quote chooser + general inquiry + about/contact -->
<div class="overlay" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="dlg" id="dlg"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
'use strict';
const PAGES={build:'wayforth-build-v5.html',trucking:'wayforth-trucking-v22.html',media:'wayforth-media.html'};
const body=document.body,home=document.getElementById('home');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let current='home';

/* ---------- routing: /build, /trucking, /media (and #build etc.) ---------- */
function routeFromURL(){
  const p=(location.pathname.replace(/^\/+|\/+$/g,'')||location.hash.slice(1)||'home').toLowerCase();
  return PAGES[p]?p:(p==='quote'?'quote':'home');
}
/* ---------- Circle Reveal: one transition at a time, always ending on the right page ----------
   Pages are created once with their address already set (no extra browser-history entries),
   loaded quietly in the background, and shown inside a circle that grows from the click point. */
const pageEl=document.getElementById('page'),frames={};
const EASE_IN='cubic-bezier(.33,.8,.2,1)',EASE_OUT='cubic-bezier(.6,0,.4,1)';
let origin={x:innerWidth/2,y:innerHeight/2},anim=null,busy=false,pending=null,shownPage=null;
const far=(x,y)=>Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y))+20;
function ensure(name){
  if(frames[name])return frames[name];
  const f=document.createElement('iframe');f.title='WAYFORTH '+name;f.dataset.p=name;f.dataset.ready='';
  f.addEventListener('load',()=>{f.dataset.ready='1';f.dispatchEvent(new Event('wf-ready'));},{once:true});
  f.src=PAGES[name]+'?v=42';pageEl.appendChild(f);frames[name]=f;return f;}
function whenReady(f){return f.dataset.ready==='1'?Promise.resolve():new Promise(r=>{body.classList.add('loading');f.addEventListener('wf-ready',()=>{body.classList.remove('loading');r();},{once:true});});}
function play(kf,opt){return new Promise(r=>{if(reduced){r();return;}anim=pageEl.animate(kf,opt);anim.onfinish=()=>{anim=null;r();};anim.oncancel=()=>{anim=null;r();};});}
function settle(){ /* make the screen match `current`, whatever happened before */
  const inPage=current!=='home';
  body.classList.toggle('in-page',inPage);body.classList.remove('closing');
  Object.entries(frames).forEach(([k,f])=>f.classList.toggle('on',inPage&&k===current));
  shownPage=inPage?current:null;
  document.title=inPage?((frames[current]&&(()=>{try{return frames[current].contentDocument.title}catch(_){return ''}})())||'WAYFORTH'):'WAYFORTH — Build. Move. Create.';
}
async function openPage(name,o){
  const f=ensure(name);await whenReady(f);
  Object.entries(frames).forEach(([k,fr])=>fr.classList.toggle('on',k===name));
  body.classList.add('in-page');
  await play([{clipPath:`circle(0px at ${o.x}px ${o.y}px)`},{clipPath:`circle(${far(o.x,o.y)}px at ${o.x}px ${o.y}px)`}],{duration:850,easing:EASE_IN});
}
async function closePage(o){
  body.classList.add('closing');body.classList.remove('in-page');
  await play([{clipPath:`circle(${far(o.x,o.y)}px at ${o.x}px ${o.y}px)`},{clipPath:`circle(0px at ${o.x}px ${o.y}px)`}],{duration:650,easing:EASE_OUT,fill:'forwards'});
  if(anim)anim.cancel();pageEl.getAnimations().forEach(a=>a.cancel());
  body.classList.remove('closing');Object.values(frames).forEach(f=>f.classList.remove('on'));
}
async function run(name,o){
  busy=true;body.classList.add('busy');
  try{
    if(name==='home'){ if(shownPage)await closePage(o); }
    else if(shownPage!==name){ if(shownPage)await closePage({x:innerWidth/2,y:innerHeight/2}); await openPage(name,shownPage?{x:innerWidth/2,y:innerHeight/2}:o); }
  }catch(_){}
  pageEl.getAnimations().forEach(a=>a.cancel());
  settle();
  busy=false;body.classList.remove('busy');
  if(pending){const p=pending;pending=null;if(p.name!==current||p.name!==shownPage){current=p.name;run(p.name,p.o);}}
}
function go(name,push=true){
  if(name==='quote'){openQuote();return;}
  if(!PAGES[name])name='home';
  const o={...origin};origin={x:innerWidth/2,y:innerHeight/2};
  if(name===current&&!busy)return;
  if(push&&name!==current)history.pushState({p:name},'',name==='home'?'/':'/'+name);
  current=name;
  if(busy){pending={name,o};return;}
  run(name,o);
}
/* warm up the three pages after the home page has settled */
addEventListener('load',()=>setTimeout(()=>['build','trucking','media'].forEach((p,i)=>setTimeout(()=>ensure(p),i*700)),1200));
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]');if(o){e.preventDefault();const r=o.getBoundingClientRect();
    origin=(e.clientX||e.clientY)?{x:e.clientX,y:e.clientY}:{x:r.left+r.width/2,y:r.top+r.height/2};go(o.dataset.open,true);return;}
  const a=e.target.closest('[data-aux]');if(a){e.preventDefault();openAux(a.dataset.aux);}
});
addEventListener('popstate',()=>{origin={x:innerWidth/2,y:innerHeight/2};go(routeFromURL(),false);});

/* ---------- messages from the Build / Trucking / Media pages ---------- */
addEventListener('message',e=>{
  if(e.origin!==location.origin&&e.origin!=='null')return;
  const d=e.data||{};
  if(d.type==='wf-single-nav'){origin={x:innerWidth/2,y:innerHeight/2};go(d.page||'home');}
  else if(d.type==='wf-aux')openAux(d.name);
  else if(d.type==='wf-build-quote')sendBuildQuote(d.payload||d);
});

/* ---------- dialogs ---------- */
const ov=document.getElementById('ov'),dlg=document.getElementById('dlg');
function openDlg(html){dlg.innerHTML=html;ov.classList.add('open');const f=dlg.querySelector('input,button');f&&f.focus({preventScroll:true});}
function closeDlg(){ov.classList.remove('open');}
ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))closeDlg();});
addEventListener('keydown',e=>{if(e.key==='Escape')closeDlg();});
const AUX={
  about:['About WAYFORTH','WAYFORTH brings construction, freight and trucking, and digital media together under one company, focused on dependable work and lasting partnerships.'],
  contact:['Contact Us','Need construction, trucking or media support? Send us a message and the WAYFORTH team will follow up.'],
  media:['Work with WAYFORTH Media','Tell us about your channel, brand or project and the media team will follow up.'],
  support:['Support','Need help with a quote, an ongoing project, a shipment or a media service? Send the details and we will point you to the right person.']
};
function openAux(name){
  const [t,p]=AUX[name]||AUX.contact;
  openDlg(`<h3 id="ovTitle">${t}</h3><p>${p}</p>${formHTML(name==='about'?'General inquiry':name==='media'?'Media inquiry':t)}`);
  bindForm();
}
function openQuote(){
  if(current!=='home'){go('home');setTimeout(openQuote,900);return;}
  wfGuide(document.querySelectorAll('#home .w'),'Choose a service to start your quote',{top:Math.max(90,document.querySelector('#home .copy').getBoundingClientRect().top-64)});
}
function _oldQuote(){
  openDlg(`<h3 id="ovTitle">What can we quote for you?</h3><p>Choose a division to start your request.</p>
   <div class="choices">
    <button class="choice t-gold" data-pick="build"><b>BUILD</b><small>Homes, plazas and raw materials</small></button>
    <button class="choice t-blue" data-pick="trucking"><b>MOVE</b><small>Cars, boats, freight and carriers</small></button>
    <button class="choice t-violet" data-pick="media"><b>CREATE</b><small>Channels, content and production</small></button>
   </div><div class="actions"><button class="btn ghost" data-close>CLOSE</button></div>`);
  dlg.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{closeDlg();
    if(b.dataset.pick==='media'){openDlg(`<h3 id="ovTitle">Media inquiry</h3><p>Tell us about your channel, brand or project.</p>${formHTML('Media inquiry')}`);bindForm();}
    else go(b.dataset.pick);});
}
function formHTML(label){
  return `<form id="inq" data-label="${label}" novalidate>
    <div class="row2"><label>Full name<input id="f-name" name="fullName" autocomplete="name" required></label><label>Phone / WhatsApp<input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required></label></div>
    <label>Email<input id="f-email" name="email" type="email" autocomplete="email" required></label>
    <label>Message<textarea id="f-notes" name="notes" placeholder="How can we help?"></textarea></label>
    <div class="status" id="f-status" role="status"></div>
    <div class="actions"><button class="btn primary" type="submit">SEND →</button><button class="btn ghost" type="button" data-close>CLOSE</button></div></form>`;
}
function bindForm(){
  const f=document.getElementById('inq');if(!f)return;
  f.addEventListener('submit',async e=>{e.preventDefault();const st=document.getElementById('f-status');
    const v=Object.fromEntries(new FormData(f).entries());const digits=(v.phone||'').replace(/\D/g,'');
    if(!v.fullName.trim()||!/^\S+@\S+\.\S{2,}$/.test(v.email||'')||digits.length<7||digits.length>15){st.className='status err';st.textContent='Please add your name, a valid email and a phone number (7 to 15 digits).';return;}
    const btn=f.querySelector('[type=submit]');btn.disabled=true;btn.textContent='SENDING…';
    try{await send({service:'general',serviceLabel:f.dataset.label,source:'WAYFORTH Home V42',details:v});
      st.className='status ok';st.textContent='Thank you. Your message has been sent to WAYFORTH and the team will follow up.';btn.textContent='SENT ✓';setTimeout(closeDlg,2200);}
    catch(err){st.className='status err';st.textContent=err.message;btn.disabled=false;btn.textContent='SEND →';}
  });
}
async function send(payload){
  const r=await fetch('/api/trucking-inquiry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||'Unable to send right now. Please try again.');return j;
}
/* Build materials cart → same lead email endpoint */
async function sendBuildQuote(q){
  const lines=(q.materials||[]).map(m=>`${m.material||m.name||'Item'}${m.category?' ('+m.category+')':''}: ${m.quantity||''} ${m.unit||''}`.trim()).join('\n');
  try{await send({service:'build',serviceLabel:'Build Materials Quote',source:'WAYFORTH Build V38',details:{
      fullName:q.contactName||'',email:q.email||'',phone:q.phone||'',projectType:(q.project&&q.project.kind)||'',projectOption:(q.project&&q.project.option)||'',
      projectLocation:q.projectLocation||'',materials:lines,notes:q.notes||''}});
    toast('Your materials quote has been sent to WAYFORTH.');}
  catch(err){toast(err.message);}
}

svcBtn.addEventListener('click',e=>{e.stopPropagation();const o=!svc.classList.contains('open');svc.classList.toggle('open',o);svcBtn.setAttribute('aria-expanded',o);});

svc.addEventListener('click',e=>{if(e.target.closest('[data-open]'))svc.classList.remove('open');});
const T=document.getElementById('toast');let tt;
function toast(m){T.textContent=m;T.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>T.classList.remove('show'),3200);}

/* ---------- one continuous scene across the three worlds ---------- */
const worlds=[...home.querySelectorAll('.w')];let sceneBox={x:0,y:64,w:innerWidth};
function place(){
  const w=home.clientWidth,h=home.clientHeight,narrow=innerWidth<=900,AR=1672/582;
  const top=document.getElementById('hdr').offsetHeight+6,below=Math.min(240,Math.max(150,h*.25)),room=h-top-below, sw=Math.min(w,Math.max(room,260)*AR), x0=(w-sw)/2;sceneBox={x:x0,y:top,w:sw};
  worlds.forEach((p,i)=>{const img=p.querySelector('.seg');
    if(narrow){img.style.left=(-i*innerWidth)+'px';img.style.removeProperty('--sw');img.style.removeProperty('--st');}
    else{const st=top+Math.max(0,(room-sw/AR)*.5);sceneBox.y=st;img.style.setProperty('--sw',sw+'px');img.style.setProperty('--st',st+'px');img.style.left=(x0-p.offsetLeft)+'px';}});
}
(function loop(){if(!body.classList.contains('in-page'))place();requestAnimationFrame(loop);})();

/* ---------- living scene: real welding, truck headlight flashes, photoshoot flashes ----------
   Positions are points on the scene picture (1672 x 582), so they stay locked to it on every screen. */
const cv=document.getElementById('fxall'),g=cv.getContext('2d');
const WELD=[[232,343],[352,330],[446,297],[290,418],[470,420],[382,470],[459,527]].map(p=>({x:p[0],y:p[1],on:0,t:Math.random()*2}));
const HEAD=[[905,492,1],[1060,495,1],[905,548,.55],[1063,548,.55]];
const CAM=[[1120,482],[1181,485],[1401,470],[1574,463],[1580,352],[1488,478],[1543,486]];
const BEACON=[[1398,60],[1431,121],[1524,56],[1551,56]];
const sparks=[],flashes=[];let last=performance.now(),nextCam=.8;
function glow(x,y,r,c,a){if(a<=0)return;const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${c},${a})`);gr.addColorStop(.3,`rgba(${c},${a*.45})`);gr.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function fx(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  if(!body.classList.contains('in-page')&&innerWidth>900){
    const d=Math.min(devicePixelRatio||1,2),W=home.clientWidth,H=home.clientHeight;if(cv.width!==Math.round(W*d)||cv.height!==Math.round(H*d)){cv.width=W*d;cv.height=H*d;}
    const k=sceneBox.w/1672;g.setTransform(d*k,0,0,d*k,d*sceneBox.x,d*sceneBox.y);g.clearRect(-sceneBox.x/k,-sceneBox.y/k,W/k,H/k);g.globalCompositeOperation='lighter';
    /* welding: a small blue-white arc that flickers, a few orange sparks that drop and fade */
    WELD.forEach(w=>{w.t-=dt;if(w.t<=0){w.on=!w.on;w.t=w.on?.6+Math.random()*1.6:.8+Math.random()*2.4;}
      if(!w.on)return;const f=Math.random();if(f<.12)return;
      glow(w.x,w.y,34+f*16,'110,165,255',.32+f*.2);glow(w.x,w.y,10+f*5,'225,240,255',1);glow(w.x,w.y,3.2,'255,255,255',1);
      if(Math.random()<dt*40)for(let i=0;i<3;i++)sparks.push({x:w.x,y:w.y,vx:(Math.random()-.5)*50,vy:-Math.random()*25,l:0,m:.5+Math.random()*.5});});
    for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.l+=dt;if(p.l>p.m){sparks.splice(i,1);continue;}p.vy+=180*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const f=1-p.l/p.m;
      g.fillStyle=`rgba(255,${150+90*f|0},${60*f|0},${f})`;g.fillRect(p.x-.8,p.y-.8,1.7,1.7);}
    /* truck: headlights pulse, then a double high-beam flash, like asking for the way */
    const c=t%4.2,hb=(c<.16||(c>.34&&c<.5))?1:0;
    HEAD.forEach(([x,y,s],i)=>{const p=.6+.15*Math.sin(t*3+i);glow(x,y,18*s,'170,215,255',.35*p*s);
      if(hb){glow(x,y,90*s,'200,228,255',.55*s);}});
    /* aircraft warning lights on the tower tops: slow red throb */
    BEACON.forEach(([x,y],i)=>{const k=Math.pow(.5+.5*Math.sin(t*2.1+i*.9),2.2);glow(x,y,14,'255,40,30',.25+.6*k);glow(x,y,2.6,'255,120,100',.5+.5*k);});
    /* media: camera flashes from the photoshoot */
    nextCam-=dt;if(nextCam<=0){const p=CAM[Math.random()*CAM.length|0];flashes.push({x:p[0],y:p[1],l:0});if(Math.random()<.35)flashes.push({x:p[0],y:p[1],l:-.14});nextCam=.35+Math.random()*1.1;}
    for(let i=flashes.length-1;i>=0;i--){const f=flashes[i];f.l+=dt;if(f.l<0)continue;if(f.l>.28){flashes.splice(i,1);continue;}const k2=Math.pow(1-f.l/.28,2);
      glow(f.x,f.y,55,'235,238,255',.38*k2);glow(f.x,f.y,12,'255,255,255',.95*k2);}
  }
  if(!reduced)requestAnimationFrame(fx);}
requestAnimationFrame(fx);

/* open the page in the address bar on first load (/build, /trucking, /media, /quote) */
const first=routeFromURL();if(first!=='home')go(first,false);
