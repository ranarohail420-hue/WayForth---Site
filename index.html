<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060d">
<title>WAYFORTH — Move. Build. Create.</title>
<style>
:root{
  --gold:#efbd61;
  --blue:#4cb8ff;
  --ink:#02060d;
  --ease:cubic-bezier(.16,.84,.18,1);
  --gx:50%;
  --gy:28%;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,a{font:inherit}
body{overscroll-behavior:none}
.app{position:fixed;inset:0;overflow:hidden;background:#02060d}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;background:#02060d;transform:translateZ(0)}
.view.active{opacity:1;visibility:visible;pointer-events:auto}
.frame{width:100%;height:100%;border:0;display:block;background:#02060d;transform:translateZ(0)}

/* HOME — approved artwork preserved, but staged like a cinematic viewport */
.home{display:grid;place-items:center;isolation:isolate;background:#02060d;overflow:hidden}
.ambient{position:absolute;inset:-15%;background:url('home-ambient.webp') center/cover no-repeat;filter:blur(28px) saturate(1.28) brightness(.58);transform:scale(1.18);opacity:.94}
.ambient:after{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 50% 31%,rgba(43,121,239,.10),transparent 28%),
 linear-gradient(180deg,rgba(1,4,10,.38),rgba(1,4,10,.10) 38%,rgba(1,4,10,.68));}
.world-wrap{position:relative;width:min(100vw,calc(100vh * 1.77931));aspect-ratio:1290/725;display:grid;place-items:center;z-index:2}
.world{position:absolute;inset:0;overflow:hidden;isolation:isolate;transform-origin:50.2% 28%;will-change:transform,filter,opacity,clip-path;box-shadow:0 30px 110px rgba(0,0,0,.44)}
.base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.hot{position:absolute;z-index:12;display:block;background:rgba(255,255,255,.001);border-radius:18px;touch-action:manipulation;-webkit-tap-highlight-color:rgba(255,255,255,.08)}
.hot:focus-visible{outline:2px solid #fff;outline-offset:3px}
.hot-build{left:2.7%;top:49.5%;width:25%;height:12.5%}
.hot-truck{left:35.1%;top:69.7%;width:29.9%;height:12.6%}
.hot-media{left:72.8%;top:49.5%;width:24.8%;height:12.5%}
.hot-quote{left:78.3%;top:1.1%;width:13.7%;height:6.7%}
.status-pill{position:absolute;z-index:20;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));padding:8px 11px;border:1px solid rgba(255,255,255,.10);border-radius:999px;background:rgba(1,7,15,.52);backdrop-filter:blur(14px);font-size:9px;font-weight:750;letter-spacing:.13em;color:rgba(255,255,255,.60);opacity:0;transition:opacity .4s ease}
.home.ready .status-pill{opacity:1}

/* INTRO — only globe first, then the existing approved world is revealed from it */
.intro-layer{position:absolute;inset:0;z-index:30;overflow:hidden;pointer-events:none;background:#02060d;opacity:1;visibility:visible;transition:opacity .34s ease,visibility .34s ease}
.intro-layer.done{opacity:0;visibility:hidden}
.intro-stars{position:absolute;inset:0;background:
 radial-gradient(circle at 12% 21%,rgba(255,255,255,.8) 0 1px,transparent 1.5px),
 radial-gradient(circle at 81% 17%,rgba(115,194,255,.9) 0 1px,transparent 1.5px),
 radial-gradient(circle at 67% 78%,rgba(255,213,126,.7) 0 1px,transparent 1.4px),
 radial-gradient(circle at 33% 72%,rgba(255,255,255,.55) 0 1px,transparent 1.3px);
 background-size:180px 160px,250px 210px,290px 250px,330px 300px;opacity:.43;animation:starDrift 8s linear infinite}
@keyframes starDrift{to{transform:translate3d(-14px,9px,0)}}
.intro-globe{position:absolute;left:50%;top:50%;width:min(112vmin,980px);aspect-ratio:1;transform:translate(-50%,-50%) scale(1.25);filter:drop-shadow(0 0 42px rgba(62,161,255,.52)) drop-shadow(0 0 90px rgba(239,189,97,.18));will-change:transform,left,top,width,filter,opacity}
.intro-ring{position:absolute;left:50%;top:50%;width:min(84vmin,760px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(119,201,255,.42);box-shadow:0 0 44px rgba(63,161,255,.18);transform:translate(-50%,-50%) rotate(-12deg)}
.intro-ring.r2{width:min(96vmin,850px);border-color:rgba(239,189,97,.27);transform:translate(-50%,-50%) rotate(19deg)}
.intro-impact{position:absolute;left:50%;top:50%;width:12vmin;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,216,127,.85);box-shadow:0 0 18px rgba(255,207,105,.78),0 0 62px rgba(58,161,255,.42);opacity:0;transform:translate(-50%,-50%) scale(.2)}
.home.intro .intro-globe{animation:introGlobe 1.72s var(--ease) both}
.home.intro .intro-ring{animation:introRing 1.58s .05s var(--ease) both}
.home.intro .intro-ring.r2{animation:introRing2 1.58s .09s var(--ease) both}
.home.intro .intro-impact{animation:introImpact .78s .20s ease-out both}
.home.intro .world{animation:worldReveal 1.56s .20s var(--ease) both}
@keyframes introGlobe{
  0%{left:50%;top:50%;width:min(124vmin,1080px);transform:translate(-50%,-50%) scale(1.34);filter:drop-shadow(0 0 54px rgba(69,164,255,.62)) brightness(1.06)}
  15%{transform:translate(-50%,-50%) scale(1.23)}
  36%{transform:translate(-50%,-50%) scale(1.28)}
  76%{left:50.2%;top:28%;width:min(29vw,300px);transform:translate(-50%,-50%) scale(1);filter:drop-shadow(0 0 24px rgba(63,157,255,.30)) brightness(1)}
  100%{left:50.2%;top:28%;width:min(27vw,280px);transform:translate(-50%,-50%) scale(.98);opacity:.05;filter:blur(1px) brightness(1)}
}
@keyframes introRing{0%{opacity:.20;transform:translate(-50%,-50%) rotate(-12deg) scale(.78)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(108deg) scale(1.72)}}
@keyframes introRing2{0%{opacity:.12;transform:translate(-50%,-50%) rotate(19deg) scale(.76)}42%{opacity:.85}100%{opacity:0;transform:translate(-50%,-50%) rotate(-112deg) scale(1.58)}}
@keyframes introImpact{0%{opacity:0;transform:translate(-50%,-50%) scale(.18)}28%{opacity:1;transform:translate(-50%,-50%) scale(.48)}100%{opacity:0;transform:translate(-50%,-50%) scale(5.5)}}
@keyframes worldReveal{
  0%{opacity:.04;clip-path:circle(4% at 50.2% 28%);transform:scale(1.09);filter:blur(10px) brightness(.55)}
  48%{opacity:.72;clip-path:circle(34% at 50.2% 28%);filter:blur(3px) brightness(.84)}
  100%{opacity:1;clip-path:circle(105% at 50.2% 28%);transform:scale(1);filter:blur(0) brightness(1)}
}
.home.ready .world{opacity:1;clip-path:none;transform:none;filter:none}

/* ORBITAL TRAVEL — the globe is the transition object, not a blue dot */
.jump{position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0;visibility:hidden;overflow:hidden;background:#02060d;--accent:#55baff;--accent2:#f0bd61}
.jump.active{opacity:1;visibility:visible}
.jump canvas{position:absolute;inset:0;width:100%;height:100%}
.jump-wash{position:absolute;inset:0;opacity:0;background:
 radial-gradient(circle at 50% 50%,rgba(255,255,255,.90) 0 2%,color-mix(in srgb,var(--accent) 58%,transparent) 14%,rgba(6,15,38,.20) 33%,rgba(2,6,13,0) 58%),
 linear-gradient(180deg,rgba(1,5,12,.12),rgba(1,5,12,.78));}
.jump-globe{position:absolute;left:var(--gx);top:var(--gy);width:var(--gsize,220px);aspect-ratio:1;transform:translate(-50%,-50%) scale(1);filter:drop-shadow(0 0 35px color-mix(in srgb,var(--accent) 52%,transparent)) drop-shadow(0 0 90px rgba(239,189,97,.16));will-change:left,top,width,transform,opacity,filter}
.jump-orbit,.jump-orbit2{position:absolute;left:var(--gx);top:var(--gy);width:calc(var(--gsize,220px)*1.18);aspect-ratio:1;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 66%,transparent);transform:translate(-50%,-50%) rotate(-13deg);box-shadow:0 0 34px color-mix(in srgb,var(--accent) 22%,transparent);opacity:.74;will-change:left,top,width,transform,opacity}
.jump-orbit2{width:calc(var(--gsize,220px)*1.36);border-color:rgba(239,189,97,.40);transform:translate(-50%,-50%) rotate(19deg);opacity:.55}
.jump-label{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);font-size:10px;font-weight:800;letter-spacing:.22em;color:rgba(255,255,255,.67);opacity:0;white-space:nowrap;text-shadow:0 2px 14px rgba(0,0,0,.65)}
.view.arriving .frame{animation:pageArrive .76s var(--ease) both}
@keyframes pageArrive{0%{transform:scale(1.055);filter:blur(8px) brightness(.72);opacity:.22}55%{opacity:1;filter:blur(1.5px) brightness(1.05)}100%{transform:scale(1);filter:none;opacity:1}}

@media(max-width:700px){
  .ambient{filter:blur(23px) saturate(1.22) brightness(.66)}
  .world-wrap{width:124vw;max-width:none;aspect-ratio:1290/725}
  .world{box-shadow:0 26px 82px rgba(0,0,0,.44)}
  .home.intro .intro-globe{animation-name:introGlobeMobile}
  @keyframes introGlobeMobile{
    0%{left:50%;top:50%;width:142vw;transform:translate(-50%,-50%) scale(1.28);filter:drop-shadow(0 0 44px rgba(69,164,255,.58)) brightness(1.05)}
    18%{transform:translate(-50%,-50%) scale(1.17)}
    39%{transform:translate(-50%,-50%) scale(1.21)}
    78%{left:50.2%;top:28%;width:37vw;transform:translate(-50%,-50%) scale(1);opacity:.92}
    100%{left:50.2%;top:28%;width:33vw;transform:translate(-50%,-50%) scale(.98);opacity:.04;filter:blur(1px)}
  }
  .status-pill{display:none}
}
@media(prefers-reduced-motion:reduce){
  .home.intro .intro-globe,.home.intro .intro-ring,.home.intro .intro-ring.r2,.home.intro .intro-impact,.home.intro .world{animation:none!important}
  .intro-layer{display:none}.world{opacity:1!important;clip-path:none!important;filter:none!important;transform:none!important}
}
</style>
</head>
<body>
<main class="app" id="app">
  <section class="view home active intro" id="homeView" aria-label="WAYFORTH home">
    <div class="ambient"></div>
    <div class="world-wrap">
      <div class="world" id="world">
        <img class="base" src="home-final.webp" alt="WAYFORTH — Build, Trucking and Media">
        <a class="hot hot-build" href="#build" data-page="build" aria-label="Open WAYFORTH Build"></a>
        <a class="hot hot-truck" href="#trucking" data-page="trucking" aria-label="Open WAYFORTH Trucking"></a>
        <a class="hot hot-media" href="#media" data-page="media" aria-label="Open WAYFORTH Media"></a>
        <a class="hot hot-quote" href="#quote" data-page="quote" aria-label="Get a quote"></a>
      </div>
    </div>
    <div class="intro-layer" id="introLayer" aria-hidden="true">
      <div class="intro-stars"></div>
      <div class="intro-ring"></div>
      <div class="intro-ring r2"></div>
      <div class="intro-impact"></div>
      <img class="intro-globe" src="globe-opening.webp" alt="">
    </div>
    <div class="status-pill">ORBITAL CONTINUITY • LIVE</div>
  </section>

  <section class="view" id="buildView"><iframe class="frame" id="buildFrame" title="WAYFORTH Build"></iframe></section>
  <section class="view" id="truckingView"><iframe class="frame" id="truckingFrame" title="WAYFORTH Trucking"></iframe></section>
  <section class="view" id="mediaView"><iframe class="frame" id="mediaFrame" title="WAYFORTH Media"></iframe></section>
  <section class="view" id="quoteView"><iframe class="frame" id="quoteFrame" title="WAYFORTH Quote"></iframe></section>

  <div class="jump" id="jump" aria-hidden="true">
    <canvas id="warpCanvas"></canvas>
    <div class="jump-wash" id="jumpWash"></div>
    <div class="jump-orbit" id="jumpOrbit"></div>
    <div class="jump-orbit2" id="jumpOrbit2"></div>
    <img class="jump-globe" id="jumpGlobe" src="globe-opening.webp" alt="">
    <div class="jump-label" id="jumpLabel"></div>
  </div>
</main>
<script>
(() => {
  const home = document.getElementById('homeView');
  const world = document.getElementById('world');
  const intro = document.getElementById('introLayer');
  const jump = document.getElementById('jump');
  const globe = document.getElementById('jumpGlobe');
  const orbit = document.getElementById('jumpOrbit');
  const orbit2 = document.getElementById('jumpOrbit2');
  const wash = document.getElementById('jumpWash');
  const label = document.getElementById('jumpLabel');
  const canvas = document.getElementById('warpCanvas');
  const ctx = canvas.getContext('2d');

  const views = {
    home,
    build: document.getElementById('buildView'),
    trucking: document.getElementById('truckingView'),
    media: document.getElementById('mediaView'),
    quote: document.getElementById('quoteView')
  };
  const frames = {
    build: document.getElementById('buildFrame'),
    trucking: document.getElementById('truckingFrame'),
    media: document.getElementById('mediaFrame'),
    quote: document.getElementById('quoteFrame')
  };
  const urls = { build:'build.html', trucking:'trucking.html', media:'media.html', quote:'quote.html' };
  const theme = {
    build:{accent:'#efbd61', accent2:'#67bfff', label:'ENTERING • WAYFORTH BUILD'},
    trucking:{accent:'#59bdff', accent2:'#efbd61', label:'ENTERING • WAYFORTH TRUCKING'},
    media:{accent:'#6d8dff', accent2:'#52d6ff', label:'ENTERING • WAYFORTH MEDIA'},
    quote:{accent:'#efbd61', accent2:'#ffffff', label:'OPENING • WAYFORTH QUOTE'}
  };
  let current='home';
  let busy=false;
  let raf=0;

  const particles = Array.from({length:72},(_,i)=>({
    a:(i/72)*Math.PI*2 + Math.sin(i*1.73)*.11,
    k:.38 + ((i*37)%100)/100*.82,
    o:.22 + ((i*19)%100)/100*.70,
    w:((i*13)%3)+.55
  }));

  function resizeCanvas(){
    const dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(innerWidth*dpr);
    canvas.height=Math.round(innerHeight*dpr);
    canvas.style.width=innerWidth+'px';
    canvas.style.height=innerHeight+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',resizeCanvas,{passive:true});
  resizeCanvas();

  function ensure(page,hash=''){
    const f=frames[page];
    if(!f)return;
    const wanted=urls[page]+hash;
    if(!f.getAttribute('src')) f.setAttribute('src',wanted);
    else if(hash){
      try{ f.contentWindow.location.hash=hash; }
      catch(_){ f.setAttribute('src',wanted); }
    }
  }

  function show(page){
    Object.values(views).forEach(v=>{v.classList.remove('active','arriving')});
    views[page].classList.add('active','arriving');
    setTimeout(()=>views[page].classList.remove('arriving'),820);
    current=page;
  }

  function globeMetrics(){
    const r=world.getBoundingClientRect();
    return {
      x:r.left+r.width*.502,
      y:r.top+r.height*.28,
      size:Math.max(64,r.width*.27)
    };
  }

  function setJumpTheme(page){
    const t=theme[page]||theme.build;
    jump.style.setProperty('--accent',t.accent);
    jump.style.setProperty('--accent2',t.accent2);
    label.textContent=t.label;
  }

  function drawWarp(progress, reverse, page, m){
    cancelAnimationFrame(raf);
    const t=theme[page]||theme.build;
    const start=performance.now();
    const dur=1060;
    function hexToRgb(h){
      const x=parseInt(h.slice(1),16);return[(x>>16)&255,(x>>8)&255,x&255];
    }
    const c1=hexToRgb(t.accent), c2=hexToRgb(t.accent2);
    function frame(now){
      const raw=Math.min(1,(now-start)/dur);
      const p=reverse?1-raw:raw;
      ctx.clearRect(0,0,innerWidth,innerHeight);
      const cx=m.x+(innerWidth*.5-m.x)*(reverse?1-p:p);
      const cy=m.y+(innerHeight*.5-m.y)*(reverse?1-p:p);
      const boost=Math.pow(reverse?1-p:p,1.55);
      ctx.lineCap='round';
      particles.forEach((pt,i)=>{
        const r0=10+pt.k*44+boost*56;
        const len=22+boost*(190+pt.k*360);
        const flatten=.72;
        const x1=cx+Math.cos(pt.a)*r0;
        const y1=cy+Math.sin(pt.a)*r0*flatten;
        const x2=cx+Math.cos(pt.a)*(r0+len);
        const y2=cy+Math.sin(pt.a)*(r0+len)*flatten;
        const mix=(i%4===0)?c2:c1;
        ctx.strokeStyle=`rgba(${mix[0]},${mix[1]},${mix[2]},${Math.min(.85,pt.o*(.12+boost))})`;
        ctx.lineWidth=pt.w;
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      });
      if(raw<1) raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
  }

  function animateOut(page,hash=''){
    if(busy||page===current)return;
    busy=true;
    ensure(page,hash);
    setJumpTheme(page);
    const m=globeMetrics();
    const diag=Math.hypot(innerWidth,innerHeight);
    const finalSize=diag*1.65;
    jump.style.setProperty('--gx',m.x+'px');
    jump.style.setProperty('--gy',m.y+'px');
    jump.style.setProperty('--gsize',m.size+'px');
    jump.classList.add('active');
    label.animate([
      {opacity:0,transform:'translateX(-50%) translateY(10px)'},
      {opacity:.72,transform:'translateX(-50%) translateY(0)',offset:.45},
      {opacity:0,transform:'translateX(-50%) translateY(-4px)'}
    ],{duration:1080,easing:'ease-out',fill:'forwards'});
    drawWarp(0,false,page,m);

    world.animate([
      {transform:'scale(1)',filter:'blur(0) brightness(1)',opacity:1},
      {transform:'scale(1.22)',filter:'blur(.3px) brightness(1.04)',opacity:1,offset:.36},
      {transform:'scale(4.15)',filter:'blur(3px) brightness(1.22)',opacity:.05}
    ],{duration:980,easing:'cubic-bezier(.52,.02,.14,1)',fill:'forwards'});

    globe.animate([
      {left:m.x+'px',top:m.y+'px',width:m.size+'px',opacity:.05,transform:'translate(-50%,-50%) scale(.98)'},
      {opacity:1,offset:.14},
      {left:'50%',top:'50%',width:finalSize+'px',opacity:1,transform:'translate(-50%,-50%) scale(1.06)'}
    ],{duration:1040,easing:'cubic-bezier(.46,.03,.11,1)',fill:'forwards'});

    orbit.animate([
      {left:m.x+'px',top:m.y+'px',width:(m.size*1.18)+'px',opacity:.35,transform:'translate(-50%,-50%) rotate(-13deg) scale(.84)'},
      {opacity:.95,offset:.23},
      {left:'50%',top:'50%',width:(finalSize*.84)+'px',opacity:0,transform:'translate(-50%,-50%) rotate(290deg) scale(1.2)'}
    ],{duration:990,easing:'cubic-bezier(.30,.04,.13,1)',fill:'forwards'});
    orbit2.animate([
      {left:m.x+'px',top:m.y+'px',width:(m.size*1.36)+'px',opacity:.24,transform:'translate(-50%,-50%) rotate(19deg) scale(.88)'},
      {opacity:.70,offset:.30},
      {left:'50%',top:'50%',width:(finalSize*.96)+'px',opacity:0,transform:'translate(-50%,-50%) rotate(-250deg) scale(1.18)'}
    ],{duration:1050,easing:'cubic-bezier(.30,.04,.13,1)',fill:'forwards'});
    wash.animate([
      {opacity:0},{opacity:.12,offset:.38},{opacity:.88,offset:.72},{opacity:1}
    ],{duration:980,easing:'ease-in-out',fill:'forwards'});

    setTimeout(()=>show(page),720);
    setTimeout(()=>{
      jump.animate([{opacity:1},{opacity:0}],{duration:260,easing:'ease-out',fill:'forwards'}).finished.then(()=>{
        jump.classList.remove('active');
        jump.style.opacity='';
        world.getAnimations().forEach(a=>a.cancel());
        [globe,orbit,orbit2,wash,label].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
        history.replaceState(null,'','#'+page);
        busy=false;
      });
    },1030);
  }

  function animateHome(){
    if(busy||current==='home')return;
    busy=true;
    const from=current;
    const m=globeMetrics();
    const diag=Math.hypot(innerWidth,innerHeight);
    const startSize=diag*1.65;
    setJumpTheme(from);
    jump.style.setProperty('--gx',m.x+'px');
    jump.style.setProperty('--gy',m.y+'px');
    jump.style.setProperty('--gsize',m.size+'px');
    jump.classList.add('active');
    jump.style.opacity='1';
    drawWarp(0,true,from,m);

    // Start as a full-screen globe/atmosphere over the current page.
    Object.assign(globe.style,{left:'50%',top:'50%',width:startSize+'px',opacity:'1',transform:'translate(-50%,-50%) scale(1.06)'});
    wash.style.opacity='1';
    show('home');
    home.classList.remove('intro');
    home.classList.add('ready');
    world.style.opacity='1';
    world.style.transform='scale(1.10)';
    world.style.filter='blur(5px) brightness(.78)';

    globe.animate([
      {left:'50%',top:'50%',width:startSize+'px',opacity:1,transform:'translate(-50%,-50%) scale(1.06)'},
      {left:m.x+'px',top:m.y+'px',width:m.size+'px',opacity:.96,transform:'translate(-50%,-50%) scale(1)',offset:.80},
      {left:m.x+'px',top:m.y+'px',width:m.size+'px',opacity:0,transform:'translate(-50%,-50%) scale(.98)'}
    ],{duration:1080,easing:'cubic-bezier(.18,.80,.16,1)',fill:'forwards'});
    orbit.animate([
      {left:'50%',top:'50%',width:(startSize*.84)+'px',opacity:0,transform:'translate(-50%,-50%) rotate(280deg) scale(1.2)'},
      {opacity:.78,offset:.28},
      {left:m.x+'px',top:m.y+'px',width:(m.size*1.18)+'px',opacity:0,transform:'translate(-50%,-50%) rotate(-13deg) scale(.86)'}
    ],{duration:1000,easing:'cubic-bezier(.18,.80,.16,1)',fill:'forwards'});
    orbit2.animate([
      {left:'50%',top:'50%',width:(startSize*.96)+'px',opacity:0,transform:'translate(-50%,-50%) rotate(-230deg) scale(1.2)'},
      {opacity:.55,offset:.34},
      {left:m.x+'px',top:m.y+'px',width:(m.size*1.36)+'px',opacity:0,transform:'translate(-50%,-50%) rotate(19deg) scale(.9)'}
    ],{duration:1060,easing:'cubic-bezier(.18,.80,.16,1)',fill:'forwards'});
    wash.animate([{opacity:1},{opacity:.70,offset:.34},{opacity:0}],{duration:1050,easing:'ease-out',fill:'forwards'});
    world.animate([
      {transform:'scale(1.10)',filter:'blur(5px) brightness(.78)',opacity:.30},
      {opacity:1,offset:.42},
      {transform:'scale(1)',filter:'blur(0) brightness(1)',opacity:1}
    ],{duration:980,easing:'cubic-bezier(.18,.80,.16,1)',fill:'forwards'});

    setTimeout(()=>{
      jump.animate([{opacity:1},{opacity:0}],{duration:230,fill:'forwards'}).finished.then(()=>{
        jump.classList.remove('active');
        jump.style.opacity='';
        world.style.opacity='';world.style.transform='';world.style.filter='';
        [globe,orbit,orbit2,wash,label,world].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
        history.replaceState(null,'','#home');
        busy=false;
      });
    },1050);
  }

  document.querySelectorAll('[data-page]').forEach(a=>a.addEventListener('click',e=>{
    e.preventDefault(); animateOut(a.dataset.page);
  }));

  addEventListener('message',e=>{
    if(e.origin!==location.origin||!e.data||e.data.type!=='wf-nav')return;
    if(e.data.page==='home') animateHome();
    else animateOut(e.data.page,e.data.hash||'');
  });

  // Intro completes quickly — based on the earlier orbital version you preferred.
  setTimeout(()=>{
    home.classList.remove('intro');home.classList.add('ready');intro.classList.add('done');
  },1780);
  // Preload pages after the opening so navigation feels instant.
  setTimeout(()=>{ensure('build');ensure('trucking')},1950);
  setTimeout(()=>{ensure('media');ensure('quote')},2500);

  const initial=location.hash.replace('#','');
  if(['build','trucking','media','quote'].includes(initial)){
    home.classList.remove('intro');home.classList.add('ready');intro.classList.add('done');
    ensure(initial);setTimeout(()=>show(initial),60);
  }
})();
</script>
</body>
</html>
