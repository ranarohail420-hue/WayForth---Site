<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02060d"><title>WAYFORTH — Move. Build. Create.</title>
<style>
:root{--gold:#efbd61;--blue:#44b7ff;--ink:#02060d;--ease:cubic-bezier(.16,.84,.18,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,a{font:inherit}.app{position:fixed;inset:0;background:#02060d;overflow:hidden}.view{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .38s ease,visibility .38s ease;background:#02060d}.view.active{opacity:1;visibility:visible;pointer-events:auto}.frame{width:100%;height:100%;border:0;display:block;background:#02060d}
/* HOME WORLD */
.home{isolation:isolate;display:grid;place-items:center;background:#02060d}.ambient{position:absolute;inset:-12%;background:url('home-ambient.webp') center/cover no-repeat;filter:blur(22px) saturate(1.25) brightness(.62);transform:scale(1.17);opacity:.88}.ambient:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 37%,rgba(31,99,195,.08),rgba(2,6,13,.14) 42%,rgba(1,4,9,.70) 100%)}.world{position:relative;width:min(100vw,calc(100vh * 1.77931));aspect-ratio:1290/725;isolation:isolate;overflow:hidden;background:#07101e;box-shadow:0 36px 100px rgba(0,0,0,.42);transform-origin:50.2% 28%}.base,.build-world,.truck-world,.dd-world{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.base{z-index:7;opacity:0}.build-world{z-index:4;opacity:0;filter:brightness(.78) saturate(.94)}.truck-world{z-index:5;opacity:0}.dd-world{z-index:4;opacity:0;filter:brightness(.13) saturate(.72)}
.sky{position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 50% 23%,rgba(49,117,230,.24),transparent 29%),linear-gradient(180deg,#061225 0%,#0a1d38 45%,#08111c 100%)}.stars{position:absolute;inset:0;z-index:1;opacity:.35;background-image:radial-gradient(circle at 12% 19%,#fff 0 1px,transparent 1.4px),radial-gradient(circle at 78% 14%,#8fcfff 0 1px,transparent 1.5px),radial-gradient(circle at 58% 8%,#fff4d0 0 1px,transparent 1.3px),radial-gradient(circle at 34% 27%,#fff 0 1px,transparent 1.4px);background-size:180px 160px,220px 190px,260px 220px,310px 270px;animation:starDrift 18s linear infinite}@keyframes starDrift{to{transform:translate3d(-16px,10px,0)}}
.globe-open{position:absolute;z-index:3;left:50.2%;top:43%;width:64%;aspect-ratio:1;transform:translate(-50%,-50%) scale(1.42);filter:drop-shadow(0 0 34px rgba(53,147,255,.40)) drop-shadow(0 0 55px rgba(235,179,76,.22));opacity:1;pointer-events:none}.orbit{position:absolute;z-index:3;left:50.2%;top:43%;width:62%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(105,195,255,.42);transform:translate(-50%,-50%) rotate(-13deg) scale(.92);box-shadow:0 0 36px rgba(57,155,255,.20);opacity:0}.orbit.o2{width:69%;border-color:rgba(239,189,97,.32);transform:translate(-50%,-50%) rotate(18deg) scale(.9)}
.impact{position:absolute;z-index:9;left:50.2%;top:43%;width:18%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.2);border:2px solid rgba(255,215,130,.8);box-shadow:0 0 18px rgba(255,207,103,.70),0 0 55px rgba(78,174,255,.42);opacity:0;pointer-events:none}.flash{position:absolute;z-index:6;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:0}.spark1{left:28.2%;top:45%;width:2%;aspect-ratio:1;background:radial-gradient(circle,#fff 0 8%,#ffd88d 18%,rgba(255,166,41,.55) 35%,transparent 70%)}.spark2{left:20.4%;top:42%;width:1.2%;aspect-ratio:1;background:radial-gradient(circle,#fff 0 8%,#ffd88d 18%,rgba(255,166,41,.55) 35%,transparent 70%)}.headlight{left:51%;top:61%;width:7%;height:5%;background:radial-gradient(ellipse,#fff 0 5%,#d8efff 16%,rgba(76,169,255,.42) 39%,transparent 70%)}.ddlight{right:7%;top:18%;width:22%;height:32%;background:radial-gradient(circle at 55% 35%,rgba(99,194,255,.65),transparent 27%),radial-gradient(circle at 70% 65%,rgba(67,85,255,.38),transparent 30%)}
.hot{position:absolute;z-index:30;display:block;background:rgba(255,255,255,.001);border-radius:18px;touch-action:manipulation;-webkit-tap-highlight-color:rgba(255,255,255,.08)}.hot:focus-visible{outline:2px solid #fff;outline-offset:3px}.hot-build{left:2.7%;top:49.5%;width:25%;height:12.5%}.hot-truck{left:35.1%;top:69.7%;width:29.9%;height:12.6%}.hot-media{left:72.8%;top:49.5%;width:24.8%;height:12.5%}.hot-quote{left:78.3%;top:1.1%;width:13.7%;height:6.7%}
/* intro timeline */
.home.intro .globe-open{animation:globePull 3.65s var(--ease) both}.home.intro .orbit{animation:orbitWake 3.6s .15s ease both}.home.intro .orbit.o2{animation-delay:.28s}.home.intro .impact{animation:wfImpact 1.05s .35s ease-out both}.home.intro .build-world{animation:buildArrive 1.15s 1.38s var(--ease) both}.home.intro .truck-world{animation:truckArrive 1.05s 1.88s var(--ease) both}.home.intro .dd-world{animation:ddArrive .95s 2.25s var(--ease) both,ddPower 1.05s 2.82s steps(1,end) both}.home.intro .spark1{animation:weld 1.35s 2.32s steps(1) 2}.home.intro .spark2{animation:weld 1.45s 2.58s steps(1) 2}.home.intro .headlight{animation:lightUp .8s 2.62s ease-out both}.home.intro .ddlight{animation:ddGlow 1.05s 2.82s steps(1,end) both}.home.intro .base{animation:finalLock .68s 3.25s ease both}
@keyframes globePull{0%{left:50%;top:50%;width:78%;opacity:1;transform:translate(-50%,-50%) scale(1.5);filter:drop-shadow(0 0 48px rgba(62,154,255,.55)) brightness(1.05)}14%{transform:translate(-50%,-50%) scale(1.34)}26%{transform:translate(-50%,-50%) scale(1.38)}62%{left:50.2%;top:31%;width:32%;transform:translate(-50%,-50%) scale(1);opacity:1;filter:drop-shadow(0 0 25px rgba(62,154,255,.30))}86%,100%{left:50.2%;top:28%;width:27%;transform:translate(-50%,-50%) scale(.98);opacity:.20;filter:blur(2px)}}
@keyframes orbitWake{0%,6%{opacity:0;transform:translate(-50%,-50%) rotate(-13deg) scale(.25)}18%{opacity:1}55%{opacity:.75;transform:translate(-50%,-50%) rotate(42deg) scale(1.13)}100%{opacity:0;transform:translate(-50%,-50%) rotate(96deg) scale(1.6)}}
@keyframes wfImpact{0%{opacity:0;transform:translate(-50%,-50%) scale(.15)}28%{opacity:1;transform:translate(-50%,-50%) scale(.42)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.8)}}
@keyframes buildArrive{0%{opacity:0;transform:translate3d(-22%,4%,0) scale(1.06);filter:blur(12px) brightness(.55)}55%{opacity:1;filter:blur(1px) brightness(.90)}82%{transform:translate3d(1%,0,0) scale(.995)}100%{opacity:1;transform:none;filter:brightness(.93)}}
@keyframes truckArrive{0%{opacity:0;transform:translate3d(-25%,-8%,0) scale(.48);filter:blur(10px) brightness(1.15)}60%{opacity:1;filter:blur(1px);transform:translate3d(2%,1%,0) scale(1.04)}82%{transform:translate3d(-.6%,0,0) scale(.995)}100%{opacity:1;transform:none;filter:none}}
@keyframes ddArrive{0%{opacity:0;transform:translate3d(24%,2%,0) scale(1.04);filter:blur(10px) brightness(.12)}65%{opacity:1;transform:translate3d(-1%,0,0) scale(.997);filter:blur(1px) brightness(.13)}100%{opacity:1;transform:none;filter:brightness(.13) saturate(.72)}}
@keyframes ddPower{0%{filter:brightness(.12) saturate(.68)}18%{filter:brightness(.72) saturate(1.1)}29%{filter:brightness(.18)}42%{filter:brightness(1.05) saturate(1.2)}55%{filter:brightness(.34)}69%,100%{filter:brightness(1) saturate(1)}}
@keyframes weld{0%,8%,15%,23%,100%{opacity:0;transform:scale(.6)}4%,12%,19%{opacity:1;transform:scale(1.8)}}@keyframes lightUp{0%{opacity:0;transform:scale(.6)}45%{opacity:1;transform:scale(1.28)}100%{opacity:.42;transform:scale(1)}}@keyframes ddGlow{0%{opacity:0}18%{opacity:.85}29%{opacity:.08}42%{opacity:1}55%{opacity:.16}69%,100%{opacity:.32}}@keyframes finalLock{0%{opacity:0;filter:blur(6px) brightness(1.05)}100%{opacity:1;filter:none}}
.home.ready .base{opacity:1}.home.ready .globe-open,.home.ready .build-world,.home.ready .truck-world,.home.ready .dd-world,.home.ready .orbit,.home.ready .impact{opacity:0}.home.ready .spark1{animation:ambientWeld 4.8s steps(1) infinite}.home.ready .spark2{animation:ambientWeld 6.2s 1.1s steps(1) infinite}.home.ready .headlight{animation:ambientHead 3.2s ease-in-out infinite}.home.ready .ddlight{animation:ambientDD 4.5s ease-in-out infinite}@keyframes ambientWeld{0%,79%,84%,89%,100%{opacity:0}81%,87%{opacity:.95;transform:scale(1.5)}}@keyframes ambientHead{0%,100%{opacity:.12}50%{opacity:.42}}@keyframes ambientDD{0%,100%{opacity:.09}50%{opacity:.25}}
/* navigation transition */
.transition{position:absolute;inset:0;z-index:100;pointer-events:none;opacity:0;visibility:hidden;background:#02060d}.transition.active{opacity:1;visibility:visible}.transition .portal{position:absolute;left:50.2%;top:28%;width:9vmin;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.2);background:radial-gradient(circle,#fff 0 4%,#cceaff 9%,rgba(70,157,255,.9) 20%,rgba(21,68,187,.7) 42%,rgba(6,15,46,.65) 62%,transparent 73%);box-shadow:0 0 24px rgba(135,215,255,.9),0 0 82px rgba(55,145,255,.62),0 0 160px rgba(242,188,83,.18)}.transition.active .portal{animation:portalExpand .92s cubic-bezier(.42,.02,.13,1) both}.transition .ring{position:absolute;left:50.2%;top:28%;width:13vmin;aspect-ratio:1;border-radius:50%;border:1px solid rgba(137,218,255,.75);transform:translate(-50%,-50%) scale(.4);opacity:0}.transition.active .ring{animation:ringExpand .88s .05s ease-out both}.transition .atmos{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50.2% 28%,rgba(255,255,255,.96),rgba(98,176,255,.44) 12%,rgba(28,68,153,.16) 31%,rgba(2,6,13,0) 58%)}.transition.active .atmos{animation:atmos .95s ease both}.transition.to-build{background:linear-gradient(180deg,#07182c,#c79a4a 145%)}.transition.to-trucking{background:linear-gradient(180deg,#06162b,#0b3155 100%)}.transition.to-media{background:linear-gradient(180deg,#030917,#091e3d 65%,#0f2861)}.transition.to-quote{background:linear-gradient(180deg,#090d15,#1b140d)}@keyframes portalExpand{0%{transform:translate(-50%,-50%) scale(.2);opacity:.2}40%{opacity:1}100%{transform:translate(-50%,-50%) scale(28);opacity:.12}}@keyframes ringExpand{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(9)}}@keyframes atmos{0%,25%{opacity:0}58%{opacity:.9}100%{opacity:1}}
.home.depart .world{animation:cameraDive .82s cubic-bezier(.52,.02,.17,1) both}@keyframes cameraDive{0%{transform:scale(1);filter:none}100%{transform:scale(3.4);filter:blur(2px) brightness(1.16)}}
/* tiny control */.soundless{position:absolute;z-index:50;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));border:1px solid rgba(255,255,255,.11);background:rgba(2,8,16,.56);color:rgba(255,255,255,.72);border-radius:999px;padding:9px 12px;font-size:9px;letter-spacing:.12em;backdrop-filter:blur(12px);opacity:0;transition:opacity .3s}.home.ready .soundless{opacity:1}
@media(max-width:700px){.ambient{filter:blur(18px) saturate(1.18) brightness(.72);opacity:1}.world{width:100vw;height:auto;aspect-ratio:1290/725;box-shadow:0 28px 90px rgba(0,0,0,.52)}.globe-open{width:96%;top:47%}.home.intro .globe-open{animation-name:globePullMobile}.transition .portal,.transition .ring{top:45%}@keyframes globePullMobile{0%{left:50%;top:50%;width:118%;opacity:1;transform:translate(-50%,-50%) scale(1.5)}18%{transform:translate(-50%,-50%) scale(1.28)}62%{left:50.2%;top:31%;width:42%;transform:translate(-50%,-50%) scale(1);opacity:1}86%,100%{left:50.2%;top:28%;width:32%;transform:translate(-50%,-50%) scale(.98);opacity:.18;filter:blur(2px)}}.soundless{bottom:max(10px,env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){.home.intro *,.home.depart .world,.transition.active *{animation:none!important}.home.intro .base{opacity:1}.home.intro .globe-open,.home.intro .build-world,.home.intro .truck-world,.home.intro .dd-world{opacity:0}}
</style></head><body><main class="app" id="app">
<section class="view home active intro" id="homeView" aria-label="WAYFORTH home"><div class="ambient"></div><div class="world" id="world"><div class="sky"></div><div class="stars"></div><img class="globe-open" src="globe-opening.webp" alt=""><div class="orbit"></div><div class="orbit o2"></div><div class="impact"></div><img class="build-world" src="world-build.webp" alt=""><img class="truck-world" src="world-truck.webp" alt=""><img class="dd-world" src="world-dd.webp" alt=""><img class="base" src="home-final.webp" alt="WAYFORTH — Build, Trucking and Media"><span class="flash spark1"></span><span class="flash spark2"></span><span class="flash headlight"></span><span class="flash ddlight"></span><a class="hot hot-build" href="#build" data-page="build" aria-label="Open WAYFORTH Build"></a><a class="hot hot-truck" href="#trucking" data-page="trucking" aria-label="Open WAYFORTH Trucking"></a><a class="hot hot-media" href="#media" data-page="media" aria-label="Open WAYFORTH Media"></a><a class="hot hot-quote" href="#quote" data-page="quote" aria-label="Get a quote"></a></div><div class="soundless">ORBITAL FOUNDRY • LIVE</div></section>
<section class="view" id="buildView"><iframe class="frame" id="buildFrame" title="WAYFORTH Build"></iframe></section><section class="view" id="truckingView"><iframe class="frame" id="truckingFrame" title="WAYFORTH Trucking"></iframe></section><section class="view" id="mediaView"><iframe class="frame" id="mediaFrame" title="WAYFORTH Media"></iframe></section><section class="view" id="quoteView"><iframe class="frame" id="quoteFrame" title="WAYFORTH Quote"></iframe></section>
<div class="transition" id="transition"><div class="portal"></div><div class="ring"></div><div class="atmos"></div></div></main>
<script>
(function(){
 const home=document.getElementById('homeView'), world=document.getElementById('world'), trans=document.getElementById('transition');
 const views={home:home,build:document.getElementById('buildView'),trucking:document.getElementById('truckingView'),media:document.getElementById('mediaView'),quote:document.getElementById('quoteView')};
 const frames={build:document.getElementById('buildFrame'),trucking:document.getElementById('truckingFrame'),media:document.getElementById('mediaFrame'),quote:document.getElementById('quoteFrame')};
 const urls={build:'build.html',trucking:'trucking.html',media:'media.html',quote:'quote.html'}; let current='home',busy=false;
 function ensure(page,hash){ if(!frames[page]) return; const wanted=urls[page]+(hash||''); if(!frames[page].getAttribute('src')) frames[page].setAttribute('src',wanted); else if(hash){ try{frames[page].contentWindow.location.hash=hash}catch(e){frames[page].setAttribute('src',wanted)} } }
 function show(page){Object.values(views).forEach(v=>v.classList.remove('active'));views[page].classList.add('active');current=page;}
 function transitionTo(page,hash){ if(busy||page===current)return;busy=true; ensure(page,hash); if(current==='home')home.classList.add('depart'); trans.className='transition active to-'+page; setTimeout(()=>show(page),620); setTimeout(()=>{trans.className='transition';home.classList.remove('depart');history.replaceState(null,'','#'+page);busy=false},960); }
 function homeBack(){if(busy||current==='home')return;busy=true;trans.className='transition active to-'+current;setTimeout(()=>{show('home');home.classList.add('ready');home.classList.remove('intro')},480);setTimeout(()=>{trans.className='transition';history.replaceState(null,'','#home');busy=false},900)}
 document.querySelectorAll('[data-page]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();transitionTo(a.dataset.page)}));
 window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='wf-nav')return;const p=e.data.page;if(p==='home')homeBack();else transitionTo(p,e.data.hash||'')});
 // finish intro, then quietly preload the heavy operating pages.
 setTimeout(()=>{home.classList.remove('intro');home.classList.add('ready')},4020);
 setTimeout(()=>{['build','trucking'].forEach(p=>ensure(p))},4300);setTimeout(()=>{['media','quote'].forEach(p=>ensure(p))},5200);
 // Deep links when refreshing the staging URL.
 const initial=location.hash.replace('#','');if(['build','trucking','media','quote'].includes(initial)){home.classList.remove('intro');home.classList.add('ready');ensure(initial);setTimeout(()=>show(initial),60)}
})();
</script></body></html>
