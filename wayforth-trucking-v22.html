<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAYFORTH Trucking</title>
<style>
:root{--gold:#f3c260;--blue:#36baff;--navy:#020a16;--line:rgba(127,166,208,.28);--muted:#a9b9cc}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:#020914}body{margin:0;background:#020914;color:#fff;font-family:Inter,Arial,sans-serif;overflow-x:hidden;min-height:100vh}
button{font:inherit}.landing{width:100%;display:flex;justify-content:center;background:#020914}.stage{position:relative;width:min(100vw,1640px);aspect-ratio:1672/941;overflow:hidden;background:#020914}.stage-img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none}
.hotspot{position:absolute;z-index:8;border:0;background:transparent;cursor:pointer;border-radius:22px}.hotspot:focus-visible{outline:2px solid #ffd36e;outline-offset:3px}
.hs-logo{left:5.1%;top:.35%;width:25.7%;height:8.6%;border-radius:8px}.hs-home{left:36.4%;top:1.4%;width:6.2%;height:7%}.hs-ship{left:42.4%;top:1.4%;width:5%;height:7%}.hs-drive{left:47.4%;top:1.4%;width:5%;height:7%}.hs-about{left:52.5%;top:1.4%;width:5.5%;height:7%}.hs-contact{left:58.1%;top:1.4%;width:6%;height:7%}.hs-quote{left:80.2%;top:1.1%;width:13.4%;height:7.2%}
.hs-car{left:3.47%;top:67.16%;width:23.12%;height:32.41%}.hs-boat{left:27.5%;top:67.7%;width:22.4%;height:30.2%}.hs-load{left:50.8%;top:67.7%;width:22.4%;height:30.2%}.hs-carrier{left:74.1%;top:67.7%;width:22.6%;height:30.2%}
.car-focus{display:none}
.car-card-pulse{position:absolute;z-index:6;left:3.47%;top:67.16%;width:23.12%;height:32.41%;overflow:hidden;border-radius:24px;pointer-events:none;transform-origin:center center;animation:carCardBreath 2.35s cubic-bezier(.45,0,.55,1) infinite;will-change:transform}
.car-card-pulse img{position:absolute;max-width:none;width:432.53%;height:308.55%;left:-15.01%;top:-207.22%;object-fit:fill;user-select:none;pointer-events:none}
@keyframes carCardBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.glow-ring{position:absolute;z-index:4;border-radius:50%;pointer-events:none;filter:drop-shadow(0 0 7px rgba(255,196,76,.9));animation:iconGlow 1.8s ease-in-out infinite;border:1.5px solid rgba(255,214,113,.2)}
.gr1{left:9.87%;top:58.13%;width:4.31%;aspect-ratio:1;animation-delay:0s}.gr2{left:38.82%;top:58.13%;width:4.31%;aspect-ratio:1;animation-delay:.6s}.gr3{left:68.66%;top:58.13%;width:4.31%;aspect-ratio:1;animation-delay:1.2s}
@keyframes iconGlow{0%,100%{opacity:.28;transform:scale(.985);box-shadow:0 0 0 0 rgba(255,202,82,0)}45%{opacity:1;transform:scale(1.025);box-shadow:0 0 14px 6px rgba(255,190,56,.5),inset 0 0 8px rgba(255,220,130,.2)}}
.flash{position:absolute;z-index:5;width:9px;height:9px;border-radius:50%;background:#fffde8;pointer-events:none;box-shadow:0 0 13px 5px #ffe26a,0 0 30px 12px rgba(255,176,28,.78);animation:flash 2.05s ease-in-out infinite}
.f1{left:41.87%;top:47.82%}.f2{left:51.91%;top:47.82%;animation-delay:.15s}.f3{left:78.80%;top:52.08%;animation-delay:.5s}.f4{left:81.64%;top:52.08%;animation-delay:.58s}.f5{left:87.05%;top:51.38%;animation-delay:.9s}.f6{left:90.93%;top:51.38%;animation-delay:.98s}
@keyframes flash{0%,100%{opacity:.12;transform:scale(.55)}14%{opacity:.95;transform:scale(1.35)}22%{opacity:.28;transform:scale(.75)}38%{opacity:1;transform:scale(1.55)}48%{opacity:.16;transform:scale(.6)}}
.map-dot{position:absolute;z-index:5;width:7px;height:7px;border-radius:50%;pointer-events:none;background:#20baff;border:1px solid rgba(127,225,255,.92);box-shadow:0 0 8px 3px rgba(33,191,255,.85),0 0 22px 8px rgba(0,110,255,.55);animation:mapPulse 2.1s ease-in-out infinite}
.m1{left:55%;top:10.8%}.m2{left:60.5%;top:15.3%;animation-delay:.35s}.m3{left:65.8%;top:19.6%;animation-delay:.7s}.m4{left:72.2%;top:12.7%;animation-delay:1.05s}.m5{left:76.8%;top:24.2%;animation-delay:1.4s}
@keyframes mapPulse{0%,100%{opacity:.34;transform:scale(.72);background:#168fe8}45%{opacity:1;transform:scale(1.5);background:#35d5ff;box-shadow:0 0 10px 4px rgba(53,213,255,.95),0 0 28px 10px rgba(0,100,255,.68)}}
.route{position:absolute;z-index:4;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.route path{fill:none;stroke-linecap:round}.route-current{stroke:#fff7bd;stroke-width:4;stroke-dasharray:16 150;stroke-dashoffset:0;filter:drop-shadow(0 0 3px #fff3a8) drop-shadow(0 0 8px #ffb42b);animation:electricFlow 1.05s linear infinite}.route-spark{fill:#fffbd6;filter:drop-shadow(0 0 5px #fff2a4) drop-shadow(0 0 10px #ff9f1a)}@keyframes electricFlow{to{stroke-dashoffset:-166}}
/* modal */
.quote-overlay{position:fixed;inset:0;z-index:1000;display:none;background:rgba(1,8,18,.72);backdrop-filter:blur(14px);padding:20px;overflow:auto}.quote-overlay.open{display:grid;place-items:center}.quote-modal{width:min(940px,100%);border:1px solid rgba(90,186,255,.34);border-radius:24px;background:linear-gradient(145deg,#123557 0%,#0b2540 38%,#07192c 100%);box-shadow:0 34px 110px rgba(0,0,0,.56),0 0 42px rgba(20,123,214,.12);overflow:hidden}.quote-head{display:flex;align-items:flex-start;gap:16px;padding:22px 26px 18px;background:linear-gradient(90deg,rgba(16,55,91,.82),rgba(8,31,54,.56));border-bottom:1px solid rgba(91,167,224,.25)}.quote-head-copy{flex:1}.quote-eyebrow{font-size:10px;letter-spacing:.2em;color:#ffd078;font-weight:900}.quote-head h2{font-size:30px;margin:6px 0 4px;letter-spacing:-.035em}.quote-head p{margin:0;color:#b8cce0;font-size:12px}.quote-close{width:40px;height:40px;border:1px solid rgba(255,205,111,.58);border-radius:50%;background:rgba(4,18,33,.32);color:#ffd27d;font-size:23px;cursor:pointer;transition:.2s}.quote-close:hover{background:rgba(255,199,91,.1);box-shadow:0 0 18px rgba(255,190,67,.18)}.quote-body{padding:22px 26px 26px}.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:0 0 24px;padding:0 4px}.progress-step{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;color:#91abc2;font-size:10px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.progress-step:not(:last-child)::after{content:"";position:absolute;top:17px;left:58%;width:84%;height:2px;background:rgba(111,158,198,.24);z-index:0}.progress-step.done:not(:last-child)::after{background:linear-gradient(90deg,#33c4ff,#f2bc59)}.progress-dot{position:relative;z-index:1;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1px solid rgba(134,179,216,.35);background:#0a2038;color:#b5c8da;font-size:13px;box-shadow:0 0 0 5px rgba(5,25,43,.8)}.progress-step.active{color:#ffd079}.progress-step.active .progress-dot{border-color:#f0bd5f;background:linear-gradient(145deg,#f0b54f,#ffd783);color:#071525;box-shadow:0 0 0 5px rgba(242,188,89,.09),0 0 22px rgba(242,188,89,.22)}.progress-step.done{color:#72d7ff}.progress-step.done .progress-dot{border-color:#4ac9ff;background:#103a5c;color:#86e3ff}.step-title{font-size:21px;margin:0 0 5px;letter-spacing:-.02em}.step-note{font-size:12px;color:#b4c7da;margin:0 0 19px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px 18px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:850;color:#ffd078;letter-spacing:.025em}.field input,.field select,.field textarea{width:100%;border:1px solid rgba(93,156,207,.42);border-radius:12px;background:rgba(4,24,43,.72);color:#f5f9fd;padding:13px 14px;outline:none;min-height:48px;box-shadow:inset 0 1px 0 rgba(255,255,255,.025);transition:border-color .2s,box-shadow .2s,background .2s}.field input:hover,.field select:hover,.field textarea:hover{background:rgba(6,31,54,.86);border-color:rgba(103,179,235,.58)}.field textarea{min-height:104px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#57c7ff;background:#082b49;box-shadow:0 0 0 3px rgba(55,185,255,.11),0 0 20px rgba(40,158,222,.08)}.choice-row{display:flex;gap:10px;flex-wrap:wrap}.choice input{display:none}.choice span{display:block;border:1px solid rgba(103,171,225,.42);border-radius:999px;padding:10px 15px;background:rgba(7,32,55,.7);color:#dceaf6;font-size:11px;font-weight:750;transition:.2s}.choice span:hover{border-color:#58c6ff;background:rgba(17,66,101,.66)}.choice input:checked+span{border-color:#f0bd5f;background:linear-gradient(90deg,rgba(240,189,95,.2),rgba(255,213,129,.1));color:#ffe0a1;box-shadow:0 0 16px rgba(240,189,95,.1)}.quote-actions{display:flex;justify-content:space-between;gap:12px;margin-top:23px;padding-top:18px;border-top:1px solid rgba(95,157,207,.18)}.btn-secondary,.btn-primary{border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer}.btn-secondary{border:1px solid rgba(104,169,222,.38);background:rgba(5,28,49,.55);color:#e0edf7}.btn-primary{border:0;background:linear-gradient(90deg,#efb34c,#ffd47a);color:#071322;box-shadow:0 8px 24px rgba(226,159,47,.18)}.form-status{display:none;margin-top:14px;padding:12px;border-radius:11px;font-size:11px}.form-status.show{display:block}.form-status.ok{background:rgba(73,210,145,.1);border:1px solid rgba(73,210,145,.28);color:#95efbd}.form-status.error{background:rgba(255,98,98,.1);border:1px solid rgba(255,98,98,.28);color:#ffb0b0}
@media(max-width:900px){.stage{width:100vw;min-width:900px}.landing{justify-content:flex-start;overflow-x:auto}.field-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.car-focus,.car-card-pulse,.glow-ring,.flash,.map-dot,.route path{animation:none!important}}
</style></head><body>
<div class="landing"><div class="stage" id="stage">
<img src="trucking-final-approved.png" class="stage-img" alt="WAYFORTH Trucking services">
<svg class="route" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true"><path class="route-current" d="M1114 152 C1117 163 1125 172 1136 179 C1145 185 1149 194 1158 202 C1167 211 1177 220 1187 228 C1195 234 1204 239 1214 243"/><circle class="route-spark" r="3.8"><animateMotion dur="1.05s" repeatCount="indefinite" path="M1114 152 C1117 163 1125 172 1136 179 C1145 185 1149 194 1158 202 C1167 211 1177 220 1187 228 C1195 234 1204 239 1214 243"/></circle></svg>
<span class="map-dot m1"></span><span class="map-dot m2"></span><span class="map-dot m3"></span><span class="map-dot m4"></span><span class="map-dot m5"></span>
<span class="flash f1"></span><span class="flash f2"></span><span class="flash f3"></span><span class="flash f4"></span><span class="flash f5"></span><span class="flash f6"></span>
<span class="glow-ring gr1"></span><span class="glow-ring gr2"></span><span class="glow-ring gr3"></span><span class="car-focus"></span>
<div class="car-card-pulse" aria-hidden="true"><img src="trucking-final-approved.png" alt=""></div>
<button class="hotspot hs-logo" data-nav="home" aria-label="WAYFORTH Home"></button><button class="hotspot hs-home" data-nav="home" aria-label="Home"></button><button class="hotspot hs-ship" data-service="car" aria-label="Ship"></button><button class="hotspot hs-drive" data-service="carrier" aria-label="Drive"></button><button class="hotspot hs-about" data-aux="about" aria-label="About"></button><button class="hotspot hs-contact" data-aux="contact" aria-label="Contact"></button><button class="hotspot hs-quote" data-service="car" aria-label="Get a quote"></button>
<button class="hotspot hs-car" data-service="car" aria-label="Ship a car"></button><button class="hotspot hs-boat" data-service="boat" aria-label="Ship a boat"></button><button class="hotspot hs-load" data-service="freight" aria-label="Move a load"></button><button class="hotspot hs-carrier" data-service="carrier" aria-label="Join carrier network"></button>
</div></div>
<div class="quote-overlay" id="quote-overlay" role="dialog" aria-modal="true" aria-labelledby="quote-title">
  <form class="quote-modal" id="quote-form">
    <div class="quote-head"><div class="quote-head-copy"><span class="quote-eyebrow">WAYFORTH TRUCKING</span><h2 id="quote-title">Shipping Quote</h2><p id="quote-subtitle">Tell us what you need to move.</p></div><button class="quote-close" type="button" id="quote-close" aria-label="Close">×</button></div>
    <div class="quote-body"><div class="progress" id="progress"><div class="progress-step active"><span class="progress-dot">1</span><span class="progress-label">Route</span></div><div class="progress-step"><span class="progress-dot">2</span><span class="progress-label">Vehicle</span></div><div class="progress-step"><span class="progress-dot">3</span><span class="progress-label">Contact</span></div></div><div id="step-host"></div><div id="form-status" class="form-status" role="status" aria-live="polite"></div><div class="quote-actions"><button class="btn-secondary" type="button" id="back-btn">← Back</button><button class="btn-primary" type="button" id="next-btn">Continue →</button></div></div>
  </form>
</div>

<script>
const serviceDefs={
 car:{title:'Ship a Car',subtitle:'Vehicle transport quote',steps:[
  {title:'Pickup & delivery',note:'Start with where the vehicle is coming from and where it needs to go.',fields:[['pickup','Pickup City / ZIP','text',true],['delivery','Delivery City / ZIP','text',true],['pickupDate','First Available Pickup Date','date',true],['transport','Transport Type','choice',true,['Open Carrier','Enclosed Carrier']]]},
  {title:'Vehicle details',note:'Tell us exactly what we are transporting.',fields:[['vehicleYear','Year','number',true],['vehicleMake','Make','text',true],['vehicleModel','Model','text',true],['vehicleType','Vehicle Type','select',true,['Car','SUV','Pickup Truck','Van','Motorcycle','Other']],['condition','Vehicle Condition','choice',true,['Runs & Drives','Non-Running']],['vehicleCount','Number of Vehicles','number',true]]},
  {title:'Your contact details',note:'Your request will be routed to the WAYFORTH team for follow-up.',fields:[['fullName','Full Name','text',true],['email','Email','email',true],['phone','Phone / WhatsApp','tel',true],['company','Company (Optional)','text',false],['notes','Notes / Special Instructions','textarea',false]]}
 ]},
 boat:{title:'Ship a Boat',subtitle:'Route → vessel details → contact.',steps:[
  {title:'Pickup & delivery',note:'Tell us the transport route and preferred timing.',fields:[['pickup','Pickup City / ZIP','text',true],['delivery','Delivery City / ZIP','text',true],['pickupDate','Preferred Pickup Date','date',true],['trailer','Boat Trailer Available?','choice',true,['Yes','No','Not Sure']]]},
  {title:'Boat details',note:'Dimensions help determine equipment, routing and permits.',fields:[['boatType','Boat Type','select',true,['Power Boat','Sailboat','Yacht','Fishing Boat','Jet Ski / PWC','Other']],['boatMake','Make / Model','text',false],['length','Overall Length (ft)','number',true],['beam','Beam / Width (ft)','number',true],['height','Overall Height (ft)','number',false],['weight','Approx. Weight (lb)','number',false]]},
  {title:'Your contact details',note:'The WAYFORTH team will review the route and equipment needs.',fields:[['fullName','Full Name','text',true],['email','Email','email',true],['phone','Phone / WhatsApp','tel',true],['company','Company / Marina (Optional)','text',false],['notes','Loading / Access Notes','textarea',false]]}
 ]},
 freight:{title:'Move a Load',subtitle:'Route → freight → contact.',steps:[
  {title:'Pickup & delivery',note:'Give us the lane and timing first.',fields:[['pickup','Pickup City / ZIP','text',true],['delivery','Delivery City / ZIP','text',true],['pickupDate','Pickup Date','date',true],['deliveryDate','Requested Delivery Date','date',false]]},
  {title:'Freight details',note:'Tell us what is moving and the equipment you expect to need.',fields:[['commodity','Commodity / Load Description','text',true],['equipment','Equipment Needed','select',true,['Dry Van','Reefer','Flatbed','Step Deck','Power Only','Car Hauler','Other / Not Sure']],['weight','Total Weight (lb)','number',false],['pallets','Pallets / Units','number',false],['dimensions','Dimensions / Special Handling','text',false]]},
  {title:'Your contact details',note:'The WAYFORTH team will route the request to the right sales/operations contact.',fields:[['fullName','Full Name','text',true],['email','Email','email',true],['phone','Phone / WhatsApp','tel',true],['company','Company','text',false],['notes','Additional Notes','textarea',false]]}
 ]},
 carrier:{title:'Join as a Carrier',subtitle:'Company → equipment → contact.',steps:[
  {title:'Carrier information',note:'Tell us who you operate as.',fields:[['company','Carrier / Company Name','text',true],['mc','MC Number','text',false],['dot','DOT Number','text',true],['currentLocation','Current Location','text',true],['authority','Operating Authority','select',true,['Active Interstate','Active Intrastate','New Authority','Other']]]},
  {title:'Equipment & lanes',note:'Help dispatch understand what you can cover.',fields:[['equipment','Equipment / Truck Type','select',true,['Car Hauler','Dry Van','Reefer','Flatbed','Step Deck','Power Only','Hotshot','Other']],['preferredLanes','Preferred Lanes / Regions','text',true],['truckCount','Number of Trucks','number',false],['insurance','Active Cargo & Liability Insurance?','choice',true,['Yes','No','In Process']]]},
  {title:'Primary contact',note:'We will use this information for carrier-network follow-up.',fields:[['fullName','Contact Name','text',true],['email','Email','email',true],['phone','Phone / WhatsApp','tel',true],['notes','Notes','textarea',false]]}
 ]}
};
let activeService='car',stepIndex=0,values={};
const overlay=document.getElementById('quote-overlay'),form=document.getElementById('quote-form'),host=document.getElementById('step-host'),statusEl=document.getElementById('form-status'),nextBtn=document.getElementById('next-btn'),backBtn=document.getElementById('back-btn'),progress=[...document.querySelectorAll('#progress .progress-step')];
function nav(scene){parent.postMessage({type:'wf-single-nav',page:scene},'*')}
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.nav)));
document.querySelectorAll('[data-scroll]').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior:'smooth'})));
document.querySelectorAll('[data-aux]').forEach(b=>b.addEventListener('click',()=>parent.postMessage({type:'wf-aux',name:b.dataset.aux},'*')));
document.querySelectorAll('[data-service]').forEach(b=>b.addEventListener('click',()=>openService(b.dataset.service)));
document.getElementById('quote-close').addEventListener('click',closeService);overlay.addEventListener('click',e=>{if(e.target===overlay)closeService()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeService()});
form.addEventListener('submit',e=>{e.preventDefault();nextBtn.click()});
function openService(service){activeService=service;stepIndex=0;values={};statusEl.className='form-status';statusEl.textContent='';document.getElementById('quote-title').textContent=serviceDefs[service].title;document.getElementById('quote-subtitle').textContent=serviceDefs[service].subtitle;overlay.classList.add('open');document.body.style.overflow='hidden';renderStep()}
function closeService(){overlay.classList.remove('open');document.body.style.overflow=''}
function fieldHTML(f){const [name,label,type,required,options]=f;const req=required?'required':'';const val=values[name]??'';if(type==='textarea')return `<div class="field full"><label>${label}${required?' *':''}</label><textarea name="${name}" ${req}>${escapeHtml(val)}</textarea></div>`;if(type==='select')return `<div class="field"><label>${label}${required?' *':''}</label><select name="${name}" ${req}><option value="">Select</option>${options.map(o=>`<option ${val===o?'selected':''}>${o}</option>`).join('')}</select></div>`;if(type==='choice')return `<div class="field full"><label>${label}${required?' *':''}</label><div class="choice-row">${options.map(o=>`<label class="choice"><input type="radio" name="${name}" value="${o}" ${val===o?'checked':''} ${req}><span>${o}</span></label>`).join('')}</div></div>`;return `<div class="field"><label>${label}${required?' *':''}</label><input name="${name}" type="${type}" value="${escapeHtml(val)}" ${type==='number'?'min="0" step="any"':''} ${req}></div>`}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderStep(){const def=serviceDefs[activeService],step=def.steps[stepIndex];const labelSets={car:['Route','Vehicle','Contact'],boat:['Route','Boat','Contact'],freight:['Route','Freight','Contact'],carrier:['Carrier','Equipment','Contact']};const labels=labelSets[activeService]||['Step 1','Step 2','Step 3'];host.innerHTML=`<h3 class="step-title">${step.title}</h3><p class="step-note">${step.note}</p><div class="field-grid">${step.fields.map(fieldHTML).join('')}</div>`;progress.forEach((p,i)=>{p.classList.toggle('active',i===stepIndex);p.classList.toggle('done',i<stepIndex);const l=p.querySelector('.progress-label');if(l)l.textContent=labels[i]});backBtn.textContent=stepIndex===0?'Cancel':'← Back';nextBtn.textContent=stepIndex===def.steps.length-1?'Submit Request →':'Continue →'}
function collectCurrent(){const fd=new FormData(form);for(const [k,v] of fd.entries())if(k!=='')values[k]=v}
function currentValid(){const inputs=[...host.querySelectorAll('input,select,textarea')];let ok=true;inputs.forEach(el=>{if(!el.checkValidity()){el.reportValidity();ok=false}});return ok}
backBtn.addEventListener('click',()=>{if(stepIndex===0){closeService();return}collectCurrent();stepIndex--;renderStep()});
nextBtn.addEventListener('click',async()=>{if(!currentValid())return;collectCurrent();const def=serviceDefs[activeService];if(stepIndex<def.steps.length-1){stepIndex++;renderStep();return}nextBtn.disabled=true;nextBtn.textContent='Sending…';statusEl.className='form-status';statusEl.textContent='';try{const response=await fetch('/api/trucking-inquiry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:activeService,serviceLabel:def.title,source:'WAYFORTH Trucking V27',details:values})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'Unable to send your request right now.');statusEl.className='form-status show ok';statusEl.textContent='Your request has been sent to WAYFORTH. A team member can review the details and follow up.';nextBtn.textContent='Sent ✓';setTimeout(closeService,2200)}catch(err){statusEl.className='form-status show error';statusEl.textContent=err.message||'Unable to send your request right now.';nextBtn.disabled=false;nextBtn.textContent='Submit Request →'}});
</script>
</body></html>
