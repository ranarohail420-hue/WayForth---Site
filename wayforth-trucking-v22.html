return `<div class="field"><label>${lab}</label><input name="${name}" type="${type}" value="${escapeHtml(val)}" ${type==='date'?`min="${todayISO()}"`:''} ${type==='number'?(name==='vehicleCount'?'min="1" step="1" inputmode="numeric"':'min="0" step="any" inputmode="decimal"'):''} ${name==='fullName'?'autocomplete="name"':name==='email'?'autocomplete="email"':name==='phone'?'autocomplete="tel" inputmode="tel"':''} ${req}></div>`}
function escapeHtml(v){return String(v).replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderStep(){const def=serviceDefs[activeService],step=def.steps[stepIndex];const labelSets={car:['Route','Vehicle','Contact'],boat:['Route','Boat','Contact'],freight:['Route','Freight','Contact'],carrier:['Carrier','Equipment','Contact']};const labels=labelSets[activeService]||['Step 1','Step 2','Step 3'];const gridClass=activeService==='car'&&stepIndex===1?'field-grid vehicle-fields':activeService==='boat'&&stepIndex===1?'field-grid boat-fields':'field-grid';host.innerHTML=`<h3 class="step-title">${step.title}</h3><p class="step-note">${step.note}</p><div class="${gridClass}">${step.fields.map(fieldHTML).join('')}</div>`;progress.forEach((p,i)=>{p.classList.toggle('active',i===stepIndex);p.classList.toggle('done',i<stepIndex);const l=p.querySelector('.progress-label');if(l)l.textContent=labels[i]});backBtn.textContent=stepIndex===0?'Cancel':'← Back';nextBtn.textContent=stepIndex===def.steps.length-1?'Submit Request →':'Continue →';if(activeService==='car'&&stepIndex===1&&values.vehicleYear&&makeOptionsKey!==`${values.vehicleYear}|${values.vehicleType||'Car / Sedan'}`)loadVehicleMakes(values.vehicleYear,values.vehicleType||'Car / Sedan')}
function collectCurrent(){const fd=new FormData(form);for(const [k,v] of fd.entries())if(k!=='')values[k]=v}
function currentValid(){statusEl.className='form-status';statusEl.textContent='';if(activeService==='car'&&stepIndex===1){const make=host.querySelector('[name="vehicleMake"]'),model=host.querySelector('[name="vehicleModel"]');if(make?.disabled||model?.disabled){statusEl.className='form-status show error';statusEl.textContent='Please wait while we load the vehicle makes and models for your selected year.';return false}}const inputs=[...host.querySelectorAll('input,select,textarea')].filter(el=>!el.disabled);let ok=true;inputs.forEach(el=>{el.setCustomValidity('');if(el.type==='date'&&el.value){if(el.value<todayISO())el.setCustomValidity('Please choose today or a future date.');else if(el.name==='deliveryDate'){const pick=host.querySelector('[name="pickupDate"]');if(pick&&pick.value&&el.value<pick.value)el.setCustomValidity('Delivery date cannot be before the pickup date.')}}if(el.name==='phone'&&el.value){const digits=el.value.replace(/\D/g,'');if(digits.length<7||digits.length>15)el.setCustomValidity('Please enter a valid phone / WhatsApp number (7 to 15 digits).')}if(el.required&&(el.type==='text'||el.tagName==='TEXTAREA')&&el.value&&!el.value.trim())el.setCustomValidity('Please fill out this field.');if(!el.checkValidity()){el.reportValidity();ok=false}});return ok}
backBtn.addEventListener('click',()=>{if(stepIndex===0){closeService();return}collectCurrent();stepIndex--;renderStep()});
nextBtn.addEventListener('click',async()=>{if(!currentValid())return;collectCurrent();const def=serviceDefs[activeService];if(stepIndex<def.steps.length-1){stepIndex++;renderStep();return}nextBtn.disabled=true;nextBtn.textContent='Sending…';statusEl.className='form-status';statusEl.textContent='';try{const response=await fetch('/api/trucking-inquiry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:activeService,serviceLabel:def.title,source:'WAYFORTH Trucking V34',details:values})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'Unable to send your request right now.');statusEl.className='form-status show ok';statusEl.textContent='Your request has been sent to WAYFORTH. A team member can review the details and follow up.';nextBtn.textContent='Sent ✓';setTimeout(closeService,2200)}catch(err){statusEl.className='form-status show error';statusEl.textContent=err.message||'Unable to send your request right now.';nextBtn.disabled=false;nextBtn.textContent='Submit Request →'}});
</script>
